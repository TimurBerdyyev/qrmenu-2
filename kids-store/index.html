<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- PAGE START -->
<title>Кроха Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@400;500;600&display=swap">
<style>
/* Layout: floating dark "app window" — header, filter rail + product grid, fitting room docked bottom-left */
:root{
  --bg:#0e0d11; --frame:#16151a; --card:#1e1d23; --card-2:#26252c; --chip:#2c2b33;
  --line:rgba(255,255,255,.07); --fg:#f3f1f5; --muted:#8e8a97; --soft:#b9b5c1;
  --accent:#f07a3a; --accent-2:#ff9a5f; --on-accent:#fff; --good:#6fc39a;
  --shadow:0 30px 90px rgba(0,0,0,.6); --veil:rgba(10,9,13,.62);
  --font-display:"Unbounded","Manrope",system-ui,sans-serif;
  --font-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#e7e6eb; --frame:#f8f7fa; --card:#ffffff; --card-2:#f1f0f4; --chip:#eeedf2;
    --line:rgba(24,20,34,.08); --fg:#1b1a20; --muted:#716d7b; --soft:#4b4853;
    --accent:#e8692a; --accent-2:#f5884a; --shadow:0 30px 80px rgba(40,30,60,.16); --veil:rgba(30,26,36,.45);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#e7e6eb; --frame:#f8f7fa; --card:#ffffff; --card-2:#f1f0f4; --chip:#eeedf2;
  --line:rgba(24,20,34,.08); --fg:#1b1a20; --muted:#716d7b; --soft:#4b4853;
  --accent:#e8692a; --accent-2:#f5884a; --shadow:0 30px 80px rgba(40,30,60,.16); --veil:rgba(30,26,36,.45);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0; background:var(--bg); color:var(--fg); font:500 14px/1.45 var(--font-body);
  background-image:radial-gradient(1200px 600px at 10% -10%, color-mix(in srgb,var(--accent) 7%, transparent), transparent 60%),
                   radial-gradient(900px 700px at 110% 110%, color-mix(in srgb,var(--fg) 4%, transparent), transparent 60%);
  padding-inline:16px; padding-block:20px 40px;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
svg{display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.app{max-width:1280px;margin:0 auto;background:var(--frame);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);overflow:clip}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;
  padding:14px 22px;background:color-mix(in srgb,var(--frame) 88%, transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav{display:flex;gap:22px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.nav button{padding:6px 0;position:relative}
.nav button[aria-pressed="true"]{color:var(--fg)}
.nav button[aria-pressed="true"]::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;border-radius:2px;background:var(--accent)}
.logo{font-family:var(--font-display);font-weight:600;font-size:20px;letter-spacing:.32em;padding-left:.32em;display:flex;align-items:center;gap:10px}
.logo i{width:9px;height:9px;border-radius:50%;background:var(--accent);display:inline-block;transform:translateY(-1px)}
.tools{display:flex;justify-content:flex-end;align-items:center;gap:6px}
.ibtn{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;color:var(--soft);transition:background .2s,color .2s;position:relative}
.ibtn:hover{background:var(--chip);color:var(--fg)}
.ibtn svg{width:18px;height:18px}
.search-pill{display:flex;align-items:center;gap:8px;height:36px;padding:0 8px 0 12px;border-radius:12px;background:var(--chip);color:var(--muted);font-size:13px}
.search-pill kbd{font:600 10px var(--font-body);padding:3px 6px;border-radius:6px;background:var(--card);color:var(--muted)}
.badge{position:absolute;top:3px;right:2px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--accent);color:var(--on-accent);font-size:10px;font-weight:700;display:grid;place-items:center;line-height:1}
.badge.bump{animation:bump .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{0%{transform:scale(.6)}100%{transform:scale(1)}}

/* body */
.shell{display:grid;grid-template-columns:250px minmax(0,1fr);gap:22px;padding:22px}
.shell>*{min-width:0}
.headline{grid-column:1/-1;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.headline h1{margin:0;font:500 26px/1.1 var(--font-display);letter-spacing:-.01em;text-wrap:balance}
.headline h1 small{font:500 13px var(--font-body);color:var(--muted);margin-left:10px;letter-spacing:0}
.sort{height:38px;padding:0 34px 0 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);appearance:none;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 17px) 16px,calc(100% - 12px) 16px;background-size:5px 5px;background-repeat:no-repeat}

/* filters */
.filters{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:18px;align-self:start;position:sticky;top:84px}
.f-head{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.reset{color:var(--accent);font-size:12px;font-weight:600;display:flex;gap:6px;align-items:center}
.reset svg{width:13px;height:13px}
.field{display:flex;align-items:center;gap:8px;background:var(--card-2);border-radius:12px;padding:0 12px;height:38px;color:var(--muted)}
.field input{border:0;background:transparent;outline:0;flex:1;min-width:0;color:var(--fg)}
.field svg{width:15px;height:15px;flex:none}
.f-label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.cats{display:flex;flex-direction:column;gap:2px}
.cat{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:11px;color:var(--soft);font-size:13px;text-align:left;transition:background .2s,color .2s}
.cat:hover{background:var(--card-2);color:var(--fg)}
.cat[aria-pressed="true"]{background:var(--chip);color:var(--fg)}
.cat .dot{width:22px;height:22px;border-radius:7px;background:var(--card-2);display:grid;place-items:center;flex:none}
.cat[aria-pressed="true"] .dot{background:var(--accent)}
.cat .dot svg{width:18px;height:18px}
.cat .n{margin-left:auto;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:6px 11px;border-radius:999px;background:var(--card-2);font-size:12px;color:var(--soft);border:1px solid transparent;transition:.2s}
.chip[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 16%,transparent);border-color:var(--accent);color:var(--fg)}
.range{position:relative;height:28px}
.range input{position:absolute;inset:0;width:100%;appearance:none;background:none;pointer-events:none;margin:0}
.range input::-webkit-slider-thumb{appearance:none;pointer-events:auto;width:16px;height:16px;border-radius:50%;background:var(--accent);border:3px solid var(--card);box-shadow:0 0 0 1px var(--accent);cursor:grab}
.range input::-moz-range-thumb{pointer-events:auto;width:12px;height:12px;border-radius:50%;background:var(--accent);border:3px solid var(--card);cursor:grab}
.range .track{position:absolute;left:0;right:0;top:13px;height:3px;border-radius:3px;background:var(--card-2)}
.range .fill{position:absolute;top:13px;height:3px;border-radius:3px;background:var(--accent)}
.prices{display:flex;justify-content:space-between;font-size:12px;color:var(--soft);font-variant-numeric:tabular-nums}

/* grid + cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;align-content:start}
.empty{grid-column:1/-1;padding:60px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:20px}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px;overflow:hidden;display:flex;flex-direction:column;gap:10px;
  transition:transform .35s cubic-bezier(.2,.8,.2,1),border-color .3s}
.card:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--accent) 30%,var(--line))}
.pic{position:relative;aspect-ratio:1/1;max-width:100%;border-radius:14px;
  background:radial-gradient(70% 60% at 50% 55%,color-mix(in srgb,var(--fg) 6%,transparent),transparent 70%)}
.pic svg{position:absolute;left:14%;top:16%;width:72%;height:74%;overflow:visible;filter:drop-shadow(0 14px 14px rgba(0,0,0,.35));transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.card:hover .pic svg{transform:scale(1.06) rotate(-1.5deg)}
.side{position:absolute;left:12px;top:12px;display:flex;flex-direction:column;gap:6px;z-index:2}
.rbtn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--chip);color:var(--soft);transition:background .2s,color .2s,transform .2s;position:relative}
.rbtn:hover{color:var(--fg)}
.rbtn svg{width:16px;height:16px}
.rbtn.fav[aria-pressed="true"]{color:var(--accent)}
.rbtn.fav[aria-pressed="true"] svg path{fill:currentColor}
.rbtn.fav.pop{animation:pop .4s cubic-bezier(.3,1.7,.5,1)}
@keyframes pop{0%{transform:scale(.7)}100%{transform:scale(1)}}
.rbtn.hang[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.rbtn[data-tip]::after{content:attr(data-tip);position:absolute;left:40px;top:50%;transform:translate(-4px,-50%);white-space:nowrap;font-size:11px;font-weight:600;
  padding:5px 9px;border-radius:8px;background:var(--fg);color:var(--frame);opacity:0;pointer-events:none;transition:.18s}
.rbtn[data-tip]:hover::after,.rbtn[data-tip]:focus-visible::after{opacity:1;transform:translate(0,-50%)}
.rate{position:absolute;right:12px;top:12px;font-size:11px;font-weight:700;padding:4px 8px;border-radius:999px;background:var(--chip);display:flex;gap:4px;align-items:center;font-variant-numeric:tabular-nums}
.rate b{color:#f3b23c}
.tag{position:absolute;right:12px;top:42px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:6px;background:color-mix(in srgb,var(--good) 20%,transparent);color:var(--good)}
.meta{display:flex;flex-direction:column;gap:2px;padding-right:56px;min-width:0}
.meta .name{font-size:13px;color:var(--soft);line-height:1.3}
.meta .size{font-size:11px;color:var(--muted)}
.price{display:flex;align-items:baseline;gap:7px;font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.price.sale .now{color:var(--accent)}
.price s{color:var(--muted);font-weight:500;font-size:12px}
.price .off{font-size:10px;font-weight:700;padding:2px 6px;border-radius:5px;background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.cart{position:absolute;right:0;bottom:0;width:58px;height:58px;display:grid;place-items:center;color:var(--soft);z-index:1}
.cart::before{content:"";position:absolute;right:-70px;bottom:-70px;width:140px;height:140px;border-radius:50%;background:var(--accent);
  transform:scale(0);transition:transform .45s cubic-bezier(.2,.9,.25,1);z-index:-1}
.card:hover .cart::before,.cart:focus-visible::before,.cart.added::before{transform:scale(1)}
.card:hover .cart,.cart:focus-visible,.cart.added{color:var(--on-accent)}
.cart svg{width:20px;height:20px;transform:translate(4px,4px);transition:transform .3s}
.cart.added svg{animation:shake .5s}
@keyframes shake{30%{transform:translate(4px,4px) rotate(-14deg) scale(1.15)}60%{transform:translate(4px,4px) rotate(10deg)}}

/* fitting room */
.fit{position:fixed;left:24px;bottom:24px;z-index:40;width:268px;max-height:calc(100% - 48px);overflow:auto;background:var(--frame);border:1px solid var(--line);border-radius:22px;
  box-shadow:0 24px 70px rgba(0,0,0,.45);padding:14px;display:flex;flex-direction:column;gap:12px;
  transform-origin:left bottom;transition:transform .45s cubic-bezier(.2,.9,.25,1),opacity .3s}
.fit.closed{transform:translateY(20px) scale(.6);opacity:0;pointer-events:none}
.fit-h{display:flex;justify-content:space-between;align-items:center}
.fit-h h2{margin:0;font:600 15px var(--font-body)}
.fit-h p{margin:2px 0 0;font-size:11.5px;color:var(--muted);line-height:1.35}
.stage-wrap{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:300/380;max-width:100%;
  background:radial-gradient(80% 60% at 50% 35%,#f4f1ec,#e2ddd5 70%,#d6d0c7)}
.stage-wrap svg{width:100%;height:100%}
.stage-tag{position:absolute;left:10px;bottom:10px;font-size:10px;font-weight:700;letter-spacing:.04em;color:#5c5650;background:rgba(255,255,255,.7);padding:3px 7px;border-radius:6px}
.zoom{position:absolute;right:8px;bottom:8px;width:30px;height:30px;border-radius:50%;background:rgba(40,36,44,.7);color:#fff;display:grid;place-items:center}
.zoom svg{width:15px;height:15px}
.dress{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:6px;text-align:center;padding:16px;
  background:rgba(22,20,26,.55);backdrop-filter:blur(7px) saturate(.6);-webkit-backdrop-filter:blur(7px) saturate(.6);color:#fff;opacity:0;pointer-events:none;transition:opacity .35s}
.dress.on{opacity:1}
.dress b{font-size:13px}
.dress span{font-size:11px;color:rgba(255,255,255,.7);max-width:170px}
.spin{width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.25);border-top-color:#fff;animation:spin .8s linear infinite;margin-bottom:4px}
@keyframes spin{to{transform:rotate(360deg)}}
.sheen{position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);transform:translateX(-120%)}
.sheen.go{animation:sheen .9s ease-out}
@keyframes sheen{to{transform:translateX(120%)}}
.layer{transform-box:fill-box;transform-origin:50% 0}
.layer.enter{animation:drop .75s cubic-bezier(.2,.85,.25,1) both}
@keyframes drop{0%{opacity:0;transform:translateY(-16px) scaleY(.9)}55%{opacity:1}75%{transform:translateY(2px) scaleY(1.02)}100%{opacity:1;transform:none}}
.layer.leave{animation:lift .35s ease forwards}
@keyframes lift{to{opacity:0;transform:translateY(-18px) scale(.96)}}
.picks-h{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}
.picks{display:flex;gap:6px;flex-wrap:wrap;min-height:44px}
.pick{position:relative;width:44px;height:44px;border-radius:11px;background:var(--card-2);display:grid;place-items:center;padding:5px}
.pick.new{animation:pop .45s cubic-bezier(.3,1.7,.5,1)}
.pick svg{width:100%;height:100%}
.pick button{position:absolute;top:-5px;right:-5px;width:17px;height:17px;border-radius:50%;background:var(--fg);color:var(--frame);display:grid;place-items:center}
.pick button svg{width:9px;height:9px}
.picks .ph{font-size:11.5px;color:var(--muted);align-self:center}
.fit-f{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;background:var(--chip);font-size:11.5px;font-weight:600}
.pill svg{width:13px;height:13px}
.pill.primary{background:var(--accent);color:var(--on-accent)}
.pill:disabled{opacity:.45;cursor:default}
.linkbtn{color:var(--accent);font-size:11.5px;font-weight:600;display:inline-flex;gap:5px;align-items:center}
.linkbtn svg{width:12px;height:12px}
.tryon{position:fixed;left:24px;bottom:24px;z-index:39;display:flex;align-items:center;gap:8px;height:42px;padding:0 14px 0 5px;border-radius:999px;background:var(--frame);border:1px solid var(--line);
  box-shadow:0 14px 40px rgba(0,0,0,.4);font-weight:600;font-size:12.5px;transition:transform .35s cubic-bezier(.2,.9,.25,1),opacity .25s}
.tryon .av{width:32px;height:32px;border-radius:50%;overflow:hidden;background:#e5e0d9}
.tryon .av svg{width:100%;height:100%}
.tryon .cnt{min-width:20px;height:20px;border-radius:10px;background:var(--accent);color:var(--on-accent);font-size:11px;display:grid;place-items:center;padding:0 5px}
.tryon.hide{opacity:0;transform:scale(.8);pointer-events:none}

/* flying garment */
.flyer{position:fixed;left:0;top:0;z-index:100;pointer-events:none;overflow:visible;will-change:transform;filter:drop-shadow(0 18px 18px rgba(0,0,0,.4))}

/* drawers, lightbox, toast */
.scrim{position:fixed;inset:0;z-index:60;background:var(--veil);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:70;width:min(380px,100%);background:var(--frame);border-left:1px solid var(--line);display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .45s cubic-bezier(.2,.9,.25,1);padding:calc(18px + env(safe-area-inset-top,0px)) 18px calc(18px + env(safe-area-inset-bottom,0px))}
.drawer.on{transform:none}
.drawer h2{margin:0;font:500 18px var(--font-display)}
.dr-h{display:flex;justify-content:space-between;align-items:center;padding-bottom:14px;border-bottom:1px solid var(--line)}
.lines{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:14px 0}
.line{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center}
.line .th{width:56px;height:56px;border-radius:12px;background:var(--card);padding:7px}
.line .th svg{width:100%;height:100%}
.line .nm{font-size:13px;line-height:1.3}
.line .pr{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.qty{display:flex;align-items:center;gap:4px;background:var(--card);border-radius:10px;padding:3px}
.qty button{width:24px;height:24px;border-radius:7px;display:grid;place-items:center}
.qty button:hover{background:var(--chip)}
.qty span{min-width:18px;text-align:center;font-variant-numeric:tabular-nums;font-size:13px}
.total{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.total .row{display:flex;justify-content:space-between;font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.total .note{font-size:12px;color:var(--muted)}
.big{height:46px;border-radius:14px;background:var(--accent);color:var(--on-accent);font-weight:700}
.box{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:24px;pointer-events:none}
.box .in{position:relative;width:min(420px,100%);aspect-ratio:300/380;max-height:calc(100% - 20px);border-radius:24px;overflow:hidden;
  background:radial-gradient(80% 60% at 50% 35%,#f4f1ec,#e2ddd5 70%,#d6d0c7);transform:scale(.85);opacity:0;transition:.35s cubic-bezier(.2,.9,.25,1)}
.box.on{pointer-events:auto}
.box.on .in{transform:none;opacity:1}
.box .in svg{width:100%;height:100%}
.box .x{position:absolute;right:12px;top:12px;width:34px;height:34px;border-radius:50%;background:rgba(40,36,44,.75);color:#fff;display:grid;place-items:center}
.toast{position:fixed;left:50%;bottom:28px;z-index:90;transform:translate(-50%,30px);opacity:0;background:var(--fg);color:var(--frame);padding:10px 16px;border-radius:12px;font-weight:600;font-size:13px;transition:.35s cubic-bezier(.2,.9,.25,1);pointer-events:none;max-width:calc(100% - 32px)}
.toast.on{transform:translate(-50%,0);opacity:1}

@media (max-width:980px){
  .nav{display:none}
  .top{grid-template-columns:auto 1fr}
  .logo{justify-content:flex-start}
  .search-pill span,.search-pill kbd{display:none}
  .search-pill{padding:0;width:36px;justify-content:center;background:none}
  .shell{grid-template-columns:1fr;padding:16px;gap:16px}
  .filters{position:static}
  .cats{flex-direction:row;overflow-x:auto;padding-bottom:4px}
  .cat{flex:none}
  .cat .n{margin-left:0}
}
@media (max-width:640px){
  body{padding-inline:10px;padding-block:10px 160px}
  .app{border-radius:20px}
  .top{padding:12px 14px}
  .logo{font-size:16px;letter-spacing:.24em}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .card{padding:10px;border-radius:16px}
  .meta{padding-right:40px}
  .meta .name{font-size:12px}
  .price{font-size:14px}
  .rbtn[data-tip]::after{display:none}

const AGES = [[1,2,"1–2 года"],[3,4,"3–4 года"],[5,6,"5–6 лет"],[7,9,"7–9 лет"]];

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const rub = n => new Intl.NumberFormat("ru-RU").format(n) + " ₽";
const plural = (n, a, b, c) => { const m10 = n % 10, m100 = n % 100; return m10 === 1 && m100 !== 11 ? a : m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20) ? b : c; };
const wait = ms => new Promise(r => setTimeout(r, ms));
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const thumb = (p, cls = "") => `<svg class="${cls}" viewBox="${p.crop.join(" ")}" preserveAspectRatio="xMidYMid meet" aria-hidden="true">${p.svg}</svg>`;
const store = {
  get(k, d){ try { const v = localStorage.getItem("kroha:" + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v){ try { localStorage.setItem("kroha:" + k, JSON.stringify(v)); } catch {} }
};
const ICON = {
  heart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10Z"/></svg>',
  hanger:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7.5a2 2 0 1 1 2-2c0 1.2-2 1.5-2 3L3.5 15a1.4 1.4 0 0 0 .9 2.5h15.2a1.4 1.4 0 0 0 .9-2.5L12 8.5"/></svg>',
  bag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 9h15l-1.3 10.2a2 2 0 0 1-2 1.8H7.8a2 2 0 0 1-2-1.8L4.5 9Z"/><path d="M8.5 9V7.5a3.5 3.5 0 0 1 7 0V9"/><path d="M12 12.5v5M9.5 15h5"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
};

/* ---------- state ---------- */
const S = {
  view:"all", cat:"all", ages:new Set(), q:"", min:0, max:5000, sort:"new", favOnly:false,
  favs:new Set(store.get("favs", ["rain","tutu"])),
  cart:new Map(store.get("cart", [])),
  fit:{ top:"tee", bottom:"jog", shoes:"kedy" },   // sample outfit so the room opens dressed
  dressedOnce:false,
};

/* ---------- catalog ---------- */
function filtered(){
  let list = P.filter(p =>
    (S.view !== "new" || p.isNew) && (S.view !== "sale" || p.old) &&
    (S.cat === "all" || p.cat === S.cat) &&
    (!S.favOnly || S.favs.has(p.id)) &&
    p.price >= S.min && p.price <= S.max &&
    (!S.q || p.name.toLowerCase().includes(S.q)) &&
    (!S.ages.size || [...S.ages].some(i => AGES[i][0] <= p.ages[1] && AGES[i][1] >= p.ages[0])));
  const f = { new:(a,b)=>(b.isNew-a.isNew)||(P.indexOf(a)-P.indexOf(b)), rating:(a,b)=>b.rating-a.rating, asc:(a,b)=>a.price-b.price, desc:(a,b)=>b.price-a.price }[S.sort];
  return list.sort(f);
}
function cardHTML(p){
  const inFit = S.fit[p.slot] === p.id, fav = S.favs.has(p.id);
  const off = p.old ? Math.round((1 - p.price / p.old) * 100) : 0;
  return `<article class="card" data-id="${p.id}">
    <div class="side">
      <button class="rbtn fav" aria-pressed="${fav}" aria-label="${fav ? "Убрать из избранного" : "В избранное"}">${ICON.heart}</button>
      <button class="rbtn hang" aria-pressed="${inFit}" data-tip="${inFit ? "Снять с модели" : "Примерить"}" aria-label="${inFit ? "Снять с модели" : "Примерить на модель"}">${ICON.hanger}</button>
    </div>
    <span class="rate"><b>★</b>${p.rating.toFixed(1)}</span>
    ${p.isNew ? '<span class="tag">Новинка</span>' : ""}
    <div class="pic">${thumb(p, "art")}</div>
    <div class="meta">
      <span class="name">${p.name}</span>
      <div class="price ${p.old ? "sale" : ""}"><span class="now">${rub(p.price)}</span>${p.old ? `<s>${rub(p.old)}</s><span class="off">−${off}%</span>` : ""}</div>
      <span class="size">${p.size}</span>
    </div>
    <button class="cart" aria-label="Добавить в корзину: ${p.name}">${ICON.bag}</button>
  </article>`;
}
function renderGrid(){
  const list = filtered();
  $("#grid").innerHTML = list.length ? list.map(cardHTML).join("") : `<div class="empty">Ничего не нашлось. Попробуйте снять часть фильтров.</div>`;
  $("#count").textContent = `${list.length} ${plural(list.length, "товар", "товара", "товаров")}`;
  $("#title").firstChild.textContent = { all:"Каталог", new:"Новинки", sale:"Распродажа" }[S.view];
}
function renderFilters(){
  $("#cats").innerHTML = CATS.map(c => {
    const n = c.id === "all" ? P.length : P.filter(p => p.cat === c.id).length;
    return `<button class="cat" data-cat="${c.id}" aria-pressed="${S.cat === c.id}"><span class="dot">${thumb(BY[c.icon])}</span>${c.name}<span class="n">${n}</span></button>`;
  }).join("");
  $("#ages").innerHTML = AGES.map((a, i) => `<button class="chip" data-age="${i}" aria-pressed="${S.ages.has(i)}">${a[2]}</button>`).join("");
  $("#favOnly").setAttribute("aria-pressed", S.favOnly);
  const lo = +$("#pmin").value, hi = +$("#pmax").value;
  $("#rfill").style.left = lo / 50 + "%"; $("#rfill").style.right = 100 - hi / 50 + "%";
  $("#pminL").textContent = rub(lo); $("#pmaxL").textContent = rub(hi);
  document.querySelectorAll(".nav button").forEach(b => b.setAttribute("aria-pressed", b.dataset.view === S.view));
}
const render = () => { renderFilters(); renderGrid(); };

/* ---------- fitting room ---------- */
const STAGE_VB = [-50, 4, 300, 380];
const fitIds = () => Object.values(S.fit).map(id => BY[id]).sort((a, b) => a.z - b.z);
function stageSVG(enterId){
  return MANNEQUIN + `<g id="layers">${fitIds().map(p => `<g class="layer${p.id === enterId ? " enter" : ""}" data-id="${p.id}">${p.svg}</g>`).join("")}</g>`;
}
function renderStage(enterId){ $("#stage").innerHTML = stageSVG(enterId); }
function renderPicks(newId){
  const ids = fitIds();
  $("#picks").innerHTML = ids.length
    ? ids.map(p => `<div class="pick${p.id === newId ? " new" : ""}" title="${p.name}">${thumb(p)}<button data-un="${p.id}" aria-label="Снять: ${p.name}">${ICON.x}</button></div>`).join("")
    : `<span class="ph">Пока пусто, выберите вещь</span>`;
  $("#pickCount").textContent = `${ids.length} ${plural(ids.length, "вещь", "вещи", "вещей")}`;
  $("#tryCnt").textContent = ids.length;
  $("#lookToCart").disabled = !ids.length;
  $("#tryAv").innerHTML = `<svg viewBox="62 0 76 76">${MANNEQUIN}${ids.filter(p => p.slot === "hat" || p.z >= 2).map(p => p.svg).join("")}</svg>`;
}
function syncHangers(){
  document.querySelectorAll(".card").forEach(c => {
    const p = BY[c.dataset.id], on = S.fit[p.slot] === p.id, b = c.querySelector(".hang");
    b.setAttribute("aria-pressed", on); b.dataset.tip = on ? "Снять с модели" : "Примерить";
    b.setAttribute("aria-label", on ? "Снять с модели" : "Примерить на модель");
  });
}
const fitEl = $("#fit"), tryEl = $("#tryon");
const isOpen = () => !fitEl.classList.contains("closed");
function openFit(open){
  fitEl.classList.toggle("closed", !open); tryEl.classList.toggle("hide", open);
  fitEl.setAttribute("aria-hidden", !open); fitEl.inert = !open;
}

/* where the visible drawing of a viewBox lands on screen (preserveAspectRatio meet) */
function placed(el, vb){
  const r = el.getBoundingClientRect(), s = Math.min(r.width / vb[2], r.height / vb[3]);
  return { x: r.left + (r.width - vb[2] * s) / 2 - vb[0] * s, y: r.top + (r.height - vb[3] * s) / 2 - vb[1] * s, s };
}
function fly(p, fromSvg){
  if (reduce || !fromSvg) return Promise.resolve(null);
  const a = placed(fromSvg, p.crop), b = placed($("#stage"), STAGE_VB);
  const [cx, cy, cw, ch] = p.crop;
  const w = cw * a.s, h = ch * a.s, k = b.s / a.s;
  const x0 = a.x + cx * a.s, y0 = a.y + cy * a.s;
  const c0 = { x: x0 + w / 2, y: y0 + h / 2 };
  const c1 = { x: b.x + (cx + cw / 2) * b.s, y: b.y + (cy + ch / 2) * b.s };
  const ctrl = { x: (c0.x + c1.x) / 2 + 40, y: Math.min(c0.y, c1.y) - 140 };
  const el = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  el.setAttribute("viewBox", p.crop.join(" ")); el.setAttribute("class", "flyer");
  el.style.width = w + "px"; el.style.height = h + "px"; el.style.left = x0 + "px"; el.style.top = y0 + "px";
  el.innerHTML = p.svg; document.body.appendChild(el);
  const T = [0, .18, .4, .62, .82, 1], R = [0, -16, 11, -7, 3, 0], SK = [0, 16, -12, 8, -3, 0], SY = [1, .9, 1.08, .95, 1.03, 1];
  const frames = T.map((t, i) => {
    const u = 1 - t, px = u*u*c0.x + 2*u*t*ctrl.x + t*t*c1.x, py = u*u*c0.y + 2*u*t*ctrl.y + t*t*c1.y;
    const sc = 1 + (k - 1) * t + Math.sin(t * Math.PI) * .18;
    return { transform:`translate(${px - c0.x}px,${py - c0.y}px) rotate(${R[i]}deg) skewX(${SK[i]}deg) scale(${sc},${sc * SY[i]})`, offset:t };
  });
  return el.animate(frames, { duration: 980, easing: "cubic-bezier(.5,0,.2,1)", fill: "forwards" }).finished.then(() => el);
}

let queue = Promise.resolve();
function wear(id, fromSvg){
  queue = queue.then(async () => {
    const p = BY[id];
    if (!isOpen()) { openFit(true); await wait(420); }
    const replaced = S.fit[p.slot];
    if (replaced) {
      const old = $(`#stage .layer[data-id="${replaced}"]`);
      if (old) { old.classList.add("leave"); }
    }
    S.fit[p.slot] = id; renderPicks(id); syncHangers();
    const clone = await fly(p, fromSvg);
    const dress = $("#dress");
    dress.classList.add("on");
    await wait(reduce ? 0 : S.dressedOnce ? 750 : 1300);
    S.dressedOnce = true;
    renderStage(id);
    dress.classList.remove("on");
    if (clone) clone.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 260, fill: "forwards" }).finished.then(() => clone.remove());
    await wait(350);
    const sh = $("#sheen"); sh.classList.remove("go"); void sh.offsetWidth; sh.classList.add("go");
    if (replaced) toast(`Заменили: ${SLOT_NAMES[p.slot]}`);
  });
}
function unwear(id){
  queue = queue.then(async () => {
    const p = BY[id]; if (S.fit[p.slot] !== id) return;
    const g = $(`#stage .layer[data-id="${id}"]`);
    delete S.fit[p.slot]; renderPicks(); syncHangers();
    if (g && !reduce) { g.classList.add("leave"); await wait(340); }
    renderStage();
  });
}

/* ---------- cart ---------- */
function saveCart(){ store.set("cart", [...S.cart]); }
function addToCart(id, n = 1, silent){
  S.cart.set(id, (S.cart.get(id) || 0) + n); saveCart(); renderCart(true);
  if (!silent) toast(`В корзине: ${BY[id].name}`);
}
function renderCart(bump){
  const n = [...S.cart.values()].reduce((a, b) => a + b, 0), b = $("#cartCount");
  b.hidden = !n; b.textContent = n;
  if (bump) { b.classList.remove("bump"); void b.offsetWidth; b.classList.add("bump"); }
  const sum = [...S.cart].reduce((a, [id, q]) => a + BY[id].price * q, 0);
  $("#lines").innerHTML = S.cart.size ? [...S.cart].map(([id, q]) => { const p = BY[id]; return `<div class="line">
      <div class="th">${thumb(p)}</div>
      <div><div class="nm">${p.name}</div><div class="pr">${rub(p.price)} · ${p.size}</div></div>
      <div class="qty"><button data-dec="${id}" aria-label="Меньше">−</button><span>${q}</span><button data-inc="${id}" aria-label="Больше">+</button></div></div>`; }).join("")
    : `<div class="empty">Корзина пуста. Добавьте вещи из каталога или весь образ из примерочной.</div>`;
  $("#sum").textContent = rub(sum);
  $("#checkout").disabled = !S.cart.size; $("#checkout").style.opacity = S.cart.size ? 1 : .45;
  $("#note").textContent = sum >= 5000 || !sum ? "Доставка бесплатно от 5 000 ₽." : `До бесплатной доставки: ${rub(5000 - sum)}.`;
}
function drawer(open){ $("#drawer").classList.toggle("on", open); $("#scrim").classList.toggle("on", open); $("#drawer").inert = !open; }

let tt;
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("on"), 2000); }

/* ---------- events ---------- */
$("#grid").addEventListener("click", e => {
  const card = e.target.closest(".card"); if (!card) return;
  const id = card.dataset.id, p = BY[id];
  if (e.target.closest(".fav")) {
    S.favs.has(id) ? S.favs.delete(id) : S.favs.add(id); store.set("favs", [...S.favs]);
    const b = e.target.closest(".fav"), on = S.favs.has(id);
    b.setAttribute("aria-pressed", on); b.setAttribute("aria-label", on ? "Убрать из избранного" : "В избранное");
    b.classList.remove("pop"); void b.offsetWidth; b.classList.add("pop");
    if (S.favOnly) renderGrid();
  } else if (e.target.closest(".hang")) {
    S.fit[p.slot] === id ? unwear(id) : wear(id, card.querySelector(".art"));
  } else if (e.target.closest(".cart")) {
    const c = e.target.closest(".cart"); c.classList.remove("added"); void c.offsetWidth; c.classList.add("added");
    setTimeout(() => c.classList.remove("added"), 900);
    addToCart(id);
  }
});
$("#picks").addEventListener("click", e => { const b = e.target.closest("[data-un]"); if (b) unwear(b.dataset.un); });
$("#cats").addEventListener("click", e => { const b = e.target.closest(".cat"); if (b) { S.cat = b.dataset.cat; render(); } });
$("#ages").addEventListener("click", e => { const b = e.target.closest(".chip"); if (!b) return; const i = +b.dataset.age; S.ages.has(i) ? S.ages.delete(i) : S.ages.add(i); render(); });
$("#favOnly").addEventListener("click", () => { S.favOnly = !S.favOnly; render(); });
$("#q").addEventListener("input", e => { S.q = e.target.value.trim().toLowerCase(); renderGrid(); });
$("#sort").addEventListener("change", e => { S.sort = e.target.value; renderGrid(); });
["#pmin", "#pmax"].forEach(s => $(s).addEventListener("input", () => {
  let lo = +$("#pmin").value, hi = +$("#pmax").value;
  if (lo > hi - 200) { if (s === "#pmin") $("#pmin").value = lo = hi - 200; else $("#pmax").value = hi = lo + 200; }
  S.min = lo; S.max = hi; render();
}));
$("#reset").addEventListener("click", () => {
  Object.assign(S, { view:"all", cat:"all", q:"", min:0, max:5000, favOnly:false }); S.ages.clear();
  $("#q").value = ""; $("#pmin").value = 0; $("#pmax").value = 5000; render();
});
document.querySelectorAll(".nav button").forEach(b => b.addEventListener("click", () => { S.view = b.dataset.view; render(); }));
const jump = () => { $("#q").focus(); $("#q").scrollIntoView({ block: "center", behavior: reduce ? "auto" : "smooth" }); };
$("#searchJump").addEventListener("click", jump);
$("#themeBtn").addEventListener("click", () => {
  const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
  const next = cur === "dark" ? "light" : "dark"; document.documentElement.dataset.theme = next; store.set("theme", next);
});
$("#fitBtn").addEventListener("click", () => openFit(!isOpen()));
$("#fitClose").addEventListener("click", () => openFit(false));
$("#tryon").addEventListener("click", () => openFit(true));
$("#startOver").addEventListener("click", () => { queue = queue.then(() => { S.fit = {}; renderPicks(); renderStage(); syncHangers(); toast("Образ сброшен"); }); });
$("#lookToCart").addEventListener("click", () => { const ids = fitIds(); ids.forEach(p => addToCart(p.id, 1, true)); toast(`Образ в корзине: ${ids.length} ${plural(ids.length, "вещь", "вещи", "вещей")}`); });
$("#cartBtn").addEventListener("click", () => drawer(true));
$("#drClose").addEventListener("click", () => drawer(false));
$("#scrim").addEventListener("click", () => drawer(false));
$("#lines").addEventListener("click", e => {
  const inc = e.target.closest("[data-inc]"), dec = e.target.closest("[data-dec]");
  if (inc) addToCart(inc.dataset.inc, 1, true);
  if (dec) { const id = dec.dataset.dec, q = S.cart.get(id) - 1; q > 0 ? S.cart.set(id, q) : S.cart.delete(id); saveCart(); renderCart(); }
});
$("#checkout").addEventListener("click", () => { $("#note").textContent = "Это демо-витрина: оплата здесь не подключена."; });
const box = $("#box");
$("#zoom").addEventListener("click", () => { $("#boxStage").innerHTML = stageSVG(); box.classList.add("on"); $("#scrim").classList.add("on"); $("#boxClose").focus(); });
const closeBox = () => { box.classList.remove("on"); if (!$("#drawer").classList.contains("on")) $("#scrim").classList.remove("on"); };
$("#boxClose").addEventListener("click", closeBox);
box.addEventListener("click", e => { if (e.target === box) closeBox(); });
$("#scrim").addEventListener("click", closeBox);
document.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); jump(); }
  if (e.key === "Escape") { drawer(false); closeBox(); }
});

/* ---------- boot ---------- */
/* dark by default, like the reference; the sun button switches and remembers */
document.documentElement.dataset.theme = store.get("theme", "dark");
render(); renderStage(); renderPicks(); renderCart(); drawer(false);
openFit(innerWidth > 640);
})();
</script>
<!-- PAGE END -->
</body>
</html>
