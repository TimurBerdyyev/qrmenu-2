<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- PAGE START -->
<title>Кибер-Академия</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: left rail of lessons + a "terminal console" workspace; dark security-ops look, lime-on-slate */
:root{
  --bg:#0a0e12; --panel:#10151b; --panel-2:#161d25; --inset:#0c1116; --line:rgba(140,170,200,.12);
  --fg:#e7edf3; --muted:#8294a6; --soft:#b4c2d0;
  --accent:#6ee7a0; --accent-dim:#1c3b2b; --cyan:#58c7e0; --amber:#f2c14e; --rose:#ff6b7a; --violet:#b495f5;
  --shadow:0 24px 70px rgba(0,0,0,.5);
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#eef2f6; --panel:#ffffff; --panel-2:#f3f6f9; --inset:#0f1620; --line:rgba(30,50,70,.12);
  --fg:#111b25; --muted:#5a6b7b; --soft:#38495a; --accent-dim:#d6f3e2; --shadow:0 24px 60px rgba(30,45,70,.14);
  color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#eef2f6; --panel:#ffffff; --panel-2:#f3f6f9; --inset:#0f1620; --line:rgba(30,50,70,.12);
  --fg:#111b25; --muted:#5a6b7b; --soft:#38495a; --accent-dim:#d6f3e2; --shadow:0 24px 60px rgba(30,45,70,.14);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:500 14px/1.5 var(--sans);
  background-image:radial-gradient(900px 500px at 100% -5%,rgba(110,231,160,.07),transparent 60%),radial-gradient(700px 600px at -10% 110%,rgba(88,199,224,.06),transparent 60%);
  padding-inline:16px;padding-block:18px 36px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea{font:inherit;color:inherit}
a{color:var(--cyan)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--mono)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.app{max-width:1200px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);overflow:clip}

/* top bar */
.top{display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,var(--panel-2),transparent);position:sticky;top:env(safe-area-inset-top,0px);z-index:20;backdrop-filter:blur(10px)}
.brand{display:flex;align-items:center;gap:11px;font-weight:800;font-size:17px;letter-spacing:-.01em}
.brand .mark{width:34px;height:34px;border-radius:10px;background:var(--accent-dim);border:1px solid rgba(110,231,160,.35);display:grid;place-items:center;color:var(--accent)}
.brand .mark svg{width:19px;height:19px}
.brand b{color:var(--accent)}
.safe{margin-left:6px;font:600 10.5px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);
  border:1px solid rgba(110,231,160,.3);background:rgba(110,231,160,.08);padding:5px 9px;border-radius:999px;white-space:nowrap}
.top .right{margin-left:auto;display:flex;align-items:center;gap:10px}
.progress-wrap{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--muted)}
.bar{width:120px;height:7px;border-radius:5px;background:var(--panel-2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--accent));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.icnbtn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--muted);border:1px solid var(--line);background:var(--panel-2);transition:.2s}
.icnbtn:hover{color:var(--fg);border-color:var(--accent)}
.icnbtn svg{width:17px;height:17px}

.wrap{display:grid;grid-template-columns:288px minmax(0,1fr);gap:0}
/* rail */
.rail{border-right:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:6px;background:var(--panel);max-height:calc(100vh - 70px);overflow:auto;position:sticky;top:70px}
.rail h2{margin:4px 6px 8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.lesson{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:12px;text-align:left;color:var(--soft);border:1px solid transparent;transition:.18s;position:relative}
.lesson:hover{background:var(--panel-2)}
.lesson[aria-current="true"]{background:var(--panel-2);border-color:var(--line)}
.lesson[aria-current="true"]::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:3px;background:var(--accent)}
.lesson .ix{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;font:700 13px var(--mono);background:var(--inset);color:var(--muted);border:1px solid var(--line)}
.lesson.done .ix{background:var(--accent-dim);color:var(--accent);border-color:rgba(110,231,160,.3)}
.lesson.done .ix svg{width:15px;height:15px}
.lesson .tx{min-width:0}
.lesson .tx b{display:block;font-size:13.5px;font-weight:600;color:var(--fg);line-height:1.25}
.lesson .tx span{font-size:11.5px;color:var(--muted)}
.lesson .diff{margin-left:auto;font:700 9.5px/1 var(--sans);letter-spacing:.05em;text-transform:uppercase;padding:4px 6px;border-radius:6px;flex:none}
.d-easy{color:var(--accent);background:rgba(110,231,160,.1)}
.d-med{color:var(--amber);background:rgba(242,193,78,.12)}
.d-hard{color:var(--rose);background:rgba(255,107,122,.12)}
.railfoot{margin-top:auto;padding:12px 8px 4px;font-size:11px;color:var(--muted);line-height:1.5;border-top:1px solid var(--line)}

/* main */
.main{padding:26px 30px 36px;min-width:0}
.crumbs{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-bottom:12px}
.crumbs .tag{padding:3px 8px;border-radius:6px;background:var(--panel-2);border:1px solid var(--line);font-family:var(--mono)}
.h1{margin:0 0 6px;font:800 27px/1.12 var(--sans);letter-spacing:-.02em;text-wrap:balance}
.lede{margin:0 0 20px;color:var(--soft);max-width:70ch;font-size:15px}
.card{background:var(--panel-2);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:16px}
.card h3{margin:0 0 10px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.card h3 svg{width:15px;height:15px;color:var(--accent)}
.card p{margin:0 0 10px;color:var(--soft)}
.card p:last-child{margin-bottom:0}
.card code{font-family:var(--mono);font-size:12.5px;background:var(--inset);padding:2px 6px;border-radius:5px;color:var(--cyan);border:1px solid var(--line)}
.note{border-left:3px solid var(--amber);background:rgba(242,193,78,.06);padding:12px 14px;border-radius:0 10px 10px 0;margin-bottom:16px;font-size:13.5px;color:var(--soft)}
.note b{color:var(--amber)}
.defend{border-left:3px solid var(--cyan);background:rgba(88,199,224,.06);padding:12px 14px;border-radius:0 10px 10px 0;margin-bottom:16px;font-size:13.5px;color:var(--soft)}
.defend b{color:var(--cyan)}

/* terminal workspace */
.term{background:var(--inset);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:16px}
.term-head{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.015)}
.dot{width:11px;height:11px;border-radius:50%}
.dot.r{background:#ff5f57}.dot.y{background:#febc2e}.dot.g{background:#28c840}
.term-head .ttl{margin-left:8px;font:600 12px var(--mono);color:var(--muted)}
.term-body{padding:16px;font-family:var(--mono);font-size:13px;color:var(--soft)}
.term-body .out{white-space:pre-wrap;word-break:break-word;line-height:1.65;margin:0}
.term-body .ln{display:block}
.c-k{color:var(--violet)}.c-s{color:var(--accent)}.c-n{color:var(--amber)}.c-c{color:var(--muted)}.c-e{color:var(--rose)}.c-i{color:var(--cyan)}

/* interaction widgets */
.lab{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;color:var(--muted);font-weight:600}
.field textarea,.field input[type=text]{background:var(--inset);border:1px solid var(--line);border-radius:11px;padding:11px 13px;font-family:var(--mono);font-size:13px;resize:vertical;min-height:0}
.field textarea{min-height:70px}
.field textarea:focus,.field input:focus{border-color:var(--accent);outline:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:11px;font-weight:700;font-size:13.5px;transition:.18s}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--accent);color:#07140d}
.btn.primary:hover{box-shadow:0 0 0 3px rgba(110,231,160,.2)}
.btn.ghost{background:var(--panel-2);border:1px solid var(--line);color:var(--soft)}
.btn.ghost:hover{border-color:var(--accent);color:var(--fg)}
.chipset{display:flex;flex-wrap:wrap;gap:7px}
.chip{font-family:var(--mono);font-size:12px;padding:7px 11px;border-radius:9px;background:var(--panel-2);border:1px solid var(--line);color:var(--soft);transition:.15s}
.chip:hover{border-color:var(--accent);color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--accent-dim);border-color:rgba(110,231,160,.4);color:var(--accent)}
.slider-row{display:flex;align-items:center;gap:14px}
.slider-row input[type=range]{flex:1;accent-color:var(--accent)}
.slider-row .val{font-family:var(--mono);min-width:96px;text-align:right;color:var(--cyan)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-family:var(--mono);font-size:12.5px}
.kv .k{color:var(--muted)}
.kv .v{color:var(--soft);word-break:break-all}

/* flag box */
.flagbox{display:flex;flex-direction:column;gap:10px;border:1px dashed var(--line);border-radius:14px;padding:16px;background:var(--panel-2)}
.flagbox .fh{display:flex;align-items:center;gap:9px;font-weight:700}
.flagbox .fh svg{width:17px;height:17px;color:var(--accent)}
.flag-in{display:flex;gap:10px;flex-wrap:wrap}
.flag-in input{flex:1;min-width:200px;background:var(--inset);border:1px solid var(--line);border-radius:11px;padding:0 14px;height:44px;font-family:var(--mono);font-size:14px;letter-spacing:.02em}
.flag-in input.shake{animation:shake .4s;border-color:var(--rose)}
@keyframes shake{25%{transform:translateX(-7px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}}
.verdict{font-size:13px;min-height:19px;font-weight:600}
.verdict.ok{color:var(--accent)}.verdict.no{color:var(--rose)}
.solved-banner{display:flex;align-items:center;gap:12px;padding:15px 18px;border-radius:14px;background:linear-gradient(90deg,rgba(110,231,160,.14),rgba(88,199,224,.08));border:1px solid rgba(110,231,160,.3);margin-bottom:16px}
.solved-banner svg{width:26px;height:26px;color:var(--accent);flex:none}
.solved-banner b{color:var(--accent)}
.solved-banner .next{margin-left:auto}
.hint{font-size:12.5px;color:var(--muted)}
.hint button{color:var(--cyan);font-weight:600;text-decoration:underline;text-underline-offset:2px}
.hint-text{margin-top:8px;padding:10px 12px;background:var(--inset);border-radius:9px;border:1px solid var(--line);color:var(--soft);font-size:12.5px}

/* confetti */
.spark{position:fixed;top:0;left:0;width:9px;height:9px;z-index:200;pointer-events:none;border-radius:2px}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,24px);opacity:0;background:var(--fg);color:var(--bg);font-weight:700;font-size:13px;padding:11px 18px;border-radius:12px;z-index:150;transition:.35s cubic-bezier(.2,.9,.25,1);pointer-events:none;max-width:calc(100% - 32px)}
.toast.on{transform:translate(-50%,0);opacity:1}

.hide{display:none!important}
@media (max-width:860px){
  .wrap{grid-template-columns:1fr}
  .rail{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line);flex-direction:row;overflow-x:auto;gap:8px}
  .rail h2,.railfoot{display:none}
  .lesson{flex:0 0 auto;width:210px}
  .main{padding:20px 16px 30px}
  .progress-wrap .lbl{display:none}
}
@media (max-width:560px){
  body{padding-inline:8px}
  .app{border-radius:16px}
  .top{padding:12px 14px;gap:10px}
  .brand{font-size:15px}.safe{display:none}
  .bar{width:70px}
  .h1{font-size:22px}
  .main{padding:18px 13px 28px}
  .card{padding:15px}
}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
<!-- HEAD END -->
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 6v6c0 4.5 3.3 7.8 8 9 4.7-1.2 8-4.5 8-9V6l-8-3Z"/><path d="m9 12 2 2 4-4"/></svg></span>
      <span>Кибер<b>·</b>Академия</span>
      <span class="safe">учебная песочница</span>
    </div>
    <div class="right">
      <div class="progress-wrap"><span class="lbl">Прогресс</span><span class="bar"><i id="barFill"></i></span><span class="mono" id="progTxt">0/0</span></div>
      <button class="icnbtn" id="themeBtn" aria-label="Сменить тему"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      <button class="icnbtn" id="resetBtn" aria-label="Сбросить прогресс"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
    </div>
  </header>

  <div class="wrap">
    <nav class="rail" id="rail" aria-label="Уроки"><h2>Траектория</h2></nav>
    <main class="main" id="main" aria-live="polite"></main>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
const el = (t, c, h) => { const n = document.createElement(t); if (c) n.className = c; if (h != null) n.innerHTML = h; return n; };
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const store = {
  get(k, d){ try { const v = localStorage.getItem("cyberacad:" + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v){ try { localStorage.setItem("cyberacad:" + k, JSON.stringify(v)); } catch {} }
};
/* ---- tiny codec helpers (used by labs) ---- */
const b64 = s => { try { return btoa(unescape(encodeURIComponent(s))); } catch { return ""; } };
const unb64 = s => { try { return decodeURIComponent(escape(atob(s.trim()))); } catch { return null; } };
const caesar = (s, k) => s.replace(/[a-zа-яё]/gi, c => {
  const up = c === c.toUpperCase();
  if (/[a-z]/i.test(c)) { const b = 97; return String.fromCharCode((c.toLowerCase().charCodeAt(0) - b + (k % 26 + 26)) % 26 + b)[up ? "toUpperCase" : "toLowerCase"](); }
  const b = 1072, a = "ёе".includes(c.toLowerCase()) ? null : null; // keep latin focus
  return c;
});
const esc = s => s.replace(/[&<>]/g, m => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;" }[m]));

/* ================= curriculum ================= */
const FLAG = id => "FLAG{" + id + "}";
const LESSONS = [
{
  id:"intro", num:"00", title:"Что такое этичный хакинг", sub:"Образ мышления и правила", diff:"easy", dkey:"d-easy",
  flag:"i_will_only_hack_what_i_own",
  render(ctx){
    return `
    <div class="card"><h3>${ICON.shield} Белый, серый, чёрный</h3>
      <p><b>White-hat</b> (этичный хакер) ищет уязвимости <b>с разрешения владельца</b>, чтобы их закрыли. <b>Black-hat</b> атакует без спроса ради выгоды. <b>Grey-hat</b> — посередине и часто нарушает закон, даже без злого умысла.</p>
      <p>Профессия называется <code>пентестер</code> или <code>security researcher</code>. Главный навык — не «взлом», а понимание того, как система устроена и где она доверяет данным, которым доверять нельзя.</p>
    </div>
    <div class="note"><b>Золотое правило.</b> Тестировать можно только то, что принадлежит вам, или на что есть письменное разрешение (scope). Атака на чужую систему без спроса — это преступление в большинстве стран. Всё в этой академии происходит в изолированной песочнице у вас в браузере.</div>
    <div class="card"><h3>${ICON.list} Легальные полигоны для практики</h3>
      <p>Когда захотите пойти дальше — тренируйтесь только на специально созданных площадках: Hack The Box, TryHackMe, PortSwigger Web Security Academy, OverTheWire, picoCTF, root-me. Там всё разрешено и безопасно.</p>
    </div>
    <div class="card"><h3>${ICON.terminal} Задание</h3>
      <p>Чтобы получить первый флаг, подтвердите правило этичного хакера. Нажмите кнопку — она выдаст флаг, который нужно вставить ниже.</p>
      <div class="row"><button class="btn primary" id="oath">${ICON.check} Принимаю правило</button></div>
      <pre class="out" id="oathOut" style="margin-top:12px"></pre>
    </div>`;
  },
  wire(ctx){
    $("#oath").addEventListener("click", () => {
      typeOut($("#oathOut"), [
        ["c-c","# Правило этичного хакера принято."],
        ["c-c","# Теперь вы тестируете только то, что вам разрешено."],
        ["c-s","flag -> " + FLAG(this.flag)]
      ]);
    });
  }
},
{
  id:"http", num:"01", title:"Анатомия HTTP-запроса", sub:"Как браузер говорит с сервером", diff:"easy", dkey:"d-easy",
  flag:"headers_tell_the_truth",
  render(){
    return `
    <div class="card"><h3>${ICON.globe} Запрос и ответ</h3>
      <p>Любое открытие страницы — это текстовый запрос к серверу и текстовый ответ. Пентестер первым делом смотрит именно на этот «сырой» обмен: метод, путь, заголовки, тело. В заголовках часто утекает лишнее.</p>
    </div>
    <div class="lab">
      <div class="field"><label>Метод и путь</label>
        <div class="row">
          <div class="chipset" id="methods"></div>
          <input type="text" id="path" value="/account?id=1" style="flex:1;min-width:160px;background:var(--inset);border:1px solid var(--line);border-radius:11px;padding:0 13px;height:40px" aria-label="Путь">
        </div>
      </div>
      <div class="field"><label>Добавить заголовки</label><div class="chipset" id="hdrs"></div></div>
    </div>
    <div class="term" style="margin-top:14px"><div class="term-head"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="ttl">request & response · learn.local</span></div>
      <div class="term-body"><pre class="out" id="httpOut"></pre></div>
    </div>
    <div class="defend"><b>Защита.</b> Сервер не должен отдавать заголовки вроде <code>Server: Apache/2.2.14</code> или <code>X-Powered-By: PHP/5.3</code> — по версии злоумышленник находит известные уязвимости. Эту строку и выдаёт флаг.</div>`;
  },
  wire(){
    const state = { method:"GET", hdrs:new Set() };
    const METHODS = ["GET","POST","PUT","DELETE"];
    const HDRS = [
      ["User-Agent","Mozilla/5.0"],["Authorization","Bearer eyJ…"],
      ["Cookie","session=9f2a…"],["X-Powered-By","PHP/5.3.2"]
    ];
    const mWrap = $("#methods"), hWrap = $("#hdrs");

function highlightSQL(q){
  return esc(q).replace(/\b(SELECT|FROM|WHERE|AND|OR)\b/g, '<span class="c-k">$1</span>')
    .replace(/('(?:[^']|'')*')/g, '<span class="c-s">$1</span>');
}
function renderLines(target, lines){
  target.innerHTML = lines.map(([c, t]) => `<span class="ln ${c}">${/<span|&lt;|&amp;/.test(t) ? t : esc(t)}</span>`).join("");
}
let typer;
function typeOut(target, lines, speed = 26){
  clearInterval(typer);
  if (reduce){ renderLines(target, lines); return; }
  target.innerHTML = ""; let i = 0;
  typer = setInterval(() => {
    if (i >= lines.length){ clearInterval(typer); return; }
    const [c, t] = lines[i++];
    const span = el("span", "ln " + c);
    span.innerHTML = /<span|&lt;|&amp;/.test(t) ? t : esc(t);
    span.style.opacity = 0; target.appendChild(span);
    span.animate([{opacity:0,transform:"translateY(3px)"},{opacity:1,transform:"none"}], {duration:180,fill:"forwards"});
  }, speed);
}

      {duration:900+Math.random()*700,easing:"cubic-bezier(.2,.7,.3,1)",fill:"forwards"}).finished.then(()=>s.remove());

}

    <div class="crumbs"><span class="tag mono">модуль ${l.num}</span><span>${{easy:"база",med:"средний уровень",hard:"продвинуто"}[l.diff]}</span></div>
    <h1 class="h1">${l.title}</h1>
    <p class="lede">${l.sub}.</p>
    ${done ? solvedBanner() : ""}
    <div id="lessonBody"></div>
    <div class="flagbox">
      <div class="fh">${ICON.flag} Отправить флаг</div>
      <p class="hint" style="margin:0">Выполните задание выше, найдите строку вида <code class="mono" style="background:var(--inset);padding:2px 6px;border-radius:5px">FLAG{…}</code> и вставьте её.</p>
      <div class="flag-in"><input type="text" id="flagInput" class="mono" placeholder="FLAG{...}" value="${done ? FLAG(l.flag) : ""}" ${done?"disabled":""} autocomplete="off" spellcheck="false"><button class="btn primary" id="flagSubmit">Проверить</button></div>
      <div class="verdict ${done?"ok":""}" id="verdict">${done?"Принято ✓":""}</div>
      <div class="hint"><button id="hintBtn">Показать подсказку</button><div class="hint-text hide" id="hintText"></div></div>
    </div>`;
  $("#lessonBody").innerHTML = l.render ? l.render() : "";
  if (l.wire) l.wire();

  $("#hintBtn").onclick = () => { const h = $("#hintText"); h.classList.toggle("hide"); h.textContent = HINTS[l.id] || "Внимательно прочитайте вывод в терминале — флаг появляется после строки flag ->."; $("#hintBtn").textContent = h.classList.contains("hide") ? "Показать подсказку" : "Скрыть подсказку"; };
  const submit = () => {
    const val = $("#flagInput").value.trim();
    const v = $("#verdict");
    if (val.replace(/\s+/g,"") === FLAG(l.flag).replace(/\s+/g,"")){
      v.className = "verdict ok"; v.textContent = "Верно! Флаг принят ✓";
      if (!solved.has(l.id)){ solved.add(l.id); store.set("solved", [...solved]); confetti(); updateProgress(); buildRail(); }
      $("#flagInput").disabled = true;
      toast(solved.size === LESSONS.length ? "Все модули пройдены! 🏆" : "Модуль пройден 🎉");
      openLesson();
      m.scrollIntoView({block:"start", behavior: reduce?"auto":"smooth"});
    } else {
      v.className = "verdict no"; v.textContent = "Пока не то. Проверьте формат FLAG{...}";
      const inp = $("#flagInput"); inp.classList.remove("shake"); void inp.offsetWidth; inp.classList.add("shake");
    }
  };
  $("#flagSubmit").onclick = submit;
  $("#flagInput").addEventListener("keydown", e => { if (e.key === "Enter") submit(); });
}
function solvedBanner(){
  const next = current < LESSONS.length - 1;
  return `<div class="solved-banner">${solved.size===LESSONS.length?ICON.trophy:ICON.check}
    <div><b>Модуль пройден.</b> ${solved.size===LESSONS.length?"Вы прошли всю программу — поздравляем!":"Можно двигаться дальше."}</div>
    ${next?`<button class="btn primary next" id="nextBtn">Следующий модуль ${ICON.arrow}</button>`:""}</div>`;
}
const HINTS = {
  intro:"Нажмите «Принимаю правило» — флаг появится в выводе зелёной строкой.",
  http:"Флаг всегда в ответе сервера, в комментарии после строки про Server/X-Powered-By.",
  b64:"Нажмите «Декодировать перехват» — Base64 раскодируется без ключа.",
  caesar:"Нажмите «Перебрать все 25 ключей» и найдите строку, которая начинается с FLAG{. Это ROT 3.",
  inspect:"Нажмите «Показать исходник кнопки» — секрет лежит прямо в переменной BYPASS.",
  sqli:"Нажмите чип с payload (он подставит ' OR '1'='1 в пароль) и выполните запрос.",
  hash:"Поставьте галочку «добавить соль», затем «Сравнить с радужной таблицей».",
};

/* ================= boot ================= */
$("#themeBtn").onclick = () => {
  const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: light)").matches ? "light":"dark");
  const next = cur === "dark" ? "light":"dark"; document.documentElement.dataset.theme = next; store.set("theme", next);
};
$("#resetBtn").onclick = () => { if (solved.size===0) { toast("Прогресс уже пуст"); return; } solved.clear(); store.set("solved", []); updateProgress(); openLesson(); toast("Прогресс сброшен"); };
document.addEventListener("click", e => { if (e.target.closest("#nextBtn")){ current = Math.min(current+1, LESSONS.length-1); store.set("last", current); openLesson(); window.scrollTo({top:0,behavior:reduce?"auto":"smooth"}); } });

const savedTheme = store.get("theme", null); if (savedTheme) document.documentElement.dataset.theme = savedTheme;
updateProgress(); openLesson();
})();
</script>
<!-- PAGE END -->
</body>
</html>
