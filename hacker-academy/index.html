<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- PAGE START -->
<title>Кибер-Академия</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: left rail of tracks+lessons + a "security console" workspace; dark ops look, lime-on-slate */
:root{
  --bg:#0a0e12; --panel:#10151b; --panel-2:#161d25; --inset:#0c1116; --line:rgba(140,170,200,.12);
  --fg:#e7edf3; --muted:#8294a6; --soft:#b4c2d0;
  --accent:#6ee7a0; --accent-dim:#1c3b2b; --cyan:#58c7e0; --amber:#f2c14e; --rose:#ff6b7a; --violet:#b495f5;
  --shadow:0 24px 70px rgba(0,0,0,.5);
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#eef2f6; --panel:#ffffff; --panel-2:#f3f6f9; --inset:#0f1620; --line:rgba(30,50,70,.12);
  --fg:#111b25; --muted:#5a6b7b; --soft:#38495a; --accent-dim:#d6f3e2; --shadow:0 24px 60px rgba(30,45,70,.14);
  color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#eef2f6; --panel:#ffffff; --panel-2:#f3f6f9; --inset:#0f1620; --line:rgba(30,50,70,.12);
  --fg:#111b25; --muted:#5a6b7b; --soft:#38495a; --accent-dim:#d6f3e2; --shadow:0 24px 60px rgba(30,45,70,.14);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:500 14px/1.5 var(--sans);
  background-image:radial-gradient(900px 500px at 100% -5%,rgba(110,231,160,.07),transparent 60%),radial-gradient(700px 600px at -10% 110%,rgba(88,199,224,.06),transparent 60%);
  padding-inline:16px;padding-block:18px 36px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea{font:inherit;color:inherit}
a{color:var(--cyan)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--mono)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.app{max-width:1200px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);overflow:clip}

/* top bar */
.top{display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,var(--panel-2),transparent);position:sticky;top:env(safe-area-inset-top,0px);z-index:20;backdrop-filter:blur(10px)}
.brand{display:flex;align-items:center;gap:11px;font-weight:800;font-size:17px;letter-spacing:-.01em}
.brand .mark{width:34px;height:34px;border-radius:10px;background:var(--accent-dim);border:1px solid rgba(110,231,160,.35);display:grid;place-items:center;color:var(--accent)}
.brand .mark svg{width:19px;height:19px}
.brand b{color:var(--accent)}
.safe{margin-left:6px;font:600 10.5px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);
  border:1px solid rgba(110,231,160,.3);background:rgba(110,231,160,.08);padding:5px 9px;border-radius:999px;white-space:nowrap}
.top .right{margin-left:auto;display:flex;align-items:center;gap:10px}
.progress-wrap{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--muted)}
.bar{width:120px;height:7px;border-radius:5px;background:var(--panel-2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--accent));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.icnbtn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--muted);border:1px solid var(--line);background:var(--panel-2);transition:.2s}
.icnbtn:hover{color:var(--fg);border-color:var(--accent)}
.icnbtn svg{width:17px;height:17px}

.wrap{display:grid;grid-template-columns:300px minmax(0,1fr);gap:0}
/* rail */
.rail{border-right:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:3px;background:var(--panel);max-height:calc(100vh - 70px);overflow:auto;position:sticky;top:70px}
.rail .trk{margin:14px 8px 7px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.rail .trk:first-child{margin-top:4px}
.rail .trk::after{content:"";flex:1;height:1px;background:var(--line)}
.lesson{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:11px;text-align:left;color:var(--soft);border:1px solid transparent;transition:.16s;position:relative}
.lesson:hover{background:var(--panel-2)}
.lesson[aria-current="true"]{background:var(--panel-2);border-color:var(--line)}
.lesson[aria-current="true"]::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:3px;background:var(--accent)}
.lesson .ix{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none;font:700 12px var(--mono);background:var(--inset);color:var(--muted);border:1px solid var(--line)}
.lesson.done .ix{background:var(--accent-dim);color:var(--accent);border-color:rgba(110,231,160,.3)}
.lesson.done .ix svg{width:14px;height:14px}
.lesson .tx{min-width:0;flex:1}
.lesson .tx b{display:block;font-size:13px;font-weight:600;color:var(--fg);line-height:1.25}
.lesson .tx span{font-size:11px;color:var(--muted)}
.lesson .kind{flex:none;color:var(--muted);opacity:.8}
.lesson .kind svg{width:14px;height:14px;display:block}
.railfoot{margin-top:12px;padding:12px 8px 4px;font-size:11px;color:var(--muted);line-height:1.5;border-top:1px solid var(--line)}

/* main */
.main{padding:26px 30px 36px;min-width:0}
.crumbs{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-bottom:12px;flex-wrap:wrap}
.crumbs .tag{padding:3px 8px;border-radius:6px;background:var(--panel-2);border:1px solid var(--line);font-family:var(--mono)}
.diffpill{font:700 9.5px/1 var(--sans);letter-spacing:.05em;text-transform:uppercase;padding:4px 7px;border-radius:6px}
.d-easy{color:var(--accent);background:rgba(110,231,160,.1)}
.d-med{color:var(--amber);background:rgba(242,193,78,.12)}
.d-hard{color:var(--rose);background:rgba(255,107,122,.12)}
.h1{margin:0 0 6px;font:800 27px/1.12 var(--sans);letter-spacing:-.02em;text-wrap:balance}
.lede{margin:0 0 20px;color:var(--soft);max-width:70ch;font-size:15px}
.card{background:var(--panel-2);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:16px}
.card h3{margin:0 0 10px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.card h3 svg{width:15px;height:15px;color:var(--accent);flex:none}
.card p{margin:0 0 10px;color:var(--soft)}
.card p:last-child{margin-bottom:0}
.card ul{margin:0 0 4px;padding-left:20px;color:var(--soft)}
.card li{margin-bottom:5px}
.card code,.lede code{font-family:var(--mono);font-size:12.5px;background:var(--inset);padding:2px 6px;border-radius:5px;color:var(--cyan);border:1px solid var(--line)}
.note{border-left:3px solid var(--amber);background:rgba(242,193,78,.06);padding:12px 14px;border-radius:0 10px 10px 0;margin-bottom:16px;font-size:13.5px;color:var(--soft)}
.note b{color:var(--amber)}
.defend{border-left:3px solid var(--cyan);background:rgba(88,199,224,.06);padding:12px 14px;border-radius:0 10px 10px 0;margin-bottom:16px;font-size:13.5px;color:var(--soft)}
.defend b{color:var(--cyan)}
.defend code{font-family:var(--mono);font-size:12px;background:var(--inset);padding:1px 5px;border-radius:4px;color:var(--cyan)}

/* terminal workspace */
.term{background:var(--inset);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:16px}
.term-head{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.015)}
.dot{width:11px;height:11px;border-radius:50%}
.dot.r{background:#ff5f57}.dot.y{background:#febc2e}.dot.g{background:#28c840}
.term-head .ttl{margin-left:8px;font:600 12px var(--mono);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.term-body{padding:16px;font-family:var(--mono);font-size:13px;color:var(--soft)}
.term-body .out{white-space:pre-wrap;word-break:break-word;line-height:1.65;margin:0}
.term-body .ln{display:block}
.c-k{color:var(--violet)}.c-s{color:var(--accent)}.c-n{color:var(--amber)}.c-c{color:var(--muted)}.c-e{color:var(--rose)}.c-i{color:var(--cyan)}

/* widgets */
.lab{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;color:var(--muted);font-weight:600}
.inp,.field textarea,.field input[type=text]{background:var(--inset);border:1px solid var(--line);border-radius:11px;padding:11px 13px;font-family:var(--mono);font-size:13px;color:var(--fg)}
.field textarea{min-height:70px;resize:vertical}
.inp:focus,.field textarea:focus,.field input:focus{border-color:var(--accent);outline:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:11px;font-weight:700;font-size:13.5px;transition:.18s}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--accent);color:#07140d}
.btn.primary:hover{box-shadow:0 0 0 3px rgba(110,231,160,.2)}
.btn.ghost{background:var(--panel-2);border:1px solid var(--line);color:var(--soft)}
.btn.ghost:hover{border-color:var(--accent);color:var(--fg)}
.chipset{display:flex;flex-wrap:wrap;gap:7px}
.chip{font-family:var(--mono);font-size:12px;padding:7px 11px;border-radius:9px;background:var(--panel-2);border:1px solid var(--line);color:var(--soft);transition:.15s}
.chip:hover{border-color:var(--accent);color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--accent-dim);border-color:rgba(110,231,160,.4);color:var(--accent)}
.slider-row{display:flex;align-items:center;gap:14px}
.slider-row input[type=range]{flex:1;accent-color:var(--accent)}
.slider-row .val{font-family:var(--mono);min-width:96px;text-align:right;color:var(--cyan)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-family:var(--mono);font-size:12.5px}
.kv .k{color:var(--muted)}
.kv .v{color:var(--soft);word-break:break-all}
.meter{height:9px;border-radius:5px;background:var(--inset);overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;width:0;transition:width .35s,background .35s}
/* code editor */
.editor{width:100%;min-height:170px;background:var(--inset);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-family:var(--mono);font-size:13px;line-height:1.6;color:var(--fg);tab-size:2;-moz-tab-size:2;resize:vertical;white-space:pre;overflow:auto}
.editor:focus{outline:none;border-color:var(--accent)}
.tests{display:flex;flex-direction:column;gap:7px}
.tcase{display:flex;gap:10px;align-items:flex-start;font-family:var(--mono);font-size:12.5px;padding:9px 12px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line)}
.tcase .st{flex:none;width:19px;height:19px;border-radius:50%;display:grid;place-items:center;margin-top:1px;font-weight:700;font-size:12px}
.tcase.pass .st{background:var(--accent);color:#07140d}
.tcase.fail .st{background:var(--rose);color:#fff}
.tcase .st svg{width:12px;height:12px}
.tcase .d{min-width:0;word-break:break-word;line-height:1.5}
.tcase .d .exp{color:var(--muted)}
.run-sum{font-weight:700;font-size:13px;margin-bottom:2px}
.panes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pane{background:var(--inset);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pane .ph{padding:8px 12px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-bottom:1px solid var(--line)}
.pane.bad .ph{color:var(--rose)}.pane.good .ph{color:var(--accent)}
.pane .pb{padding:12px;font-size:13px;min-height:52px;word-break:break-word}

/* quiz */
.quiz{display:flex;flex-direction:column;gap:18px}
.q{background:var(--panel-2);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.q .qt{font-weight:600;margin-bottom:12px;color:var(--fg)}
.q .qt .n{color:var(--accent);font-family:var(--mono);margin-right:8px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:flex-start;gap:11px;padding:11px 13px;border-radius:11px;background:var(--inset);border:1px solid var(--line);text-align:left;color:var(--soft);transition:.15s}
.opt:hover{border-color:var(--accent)}
.opt .mk{width:18px;height:18px;border-radius:50%;border:2px solid var(--muted);flex:none;margin-top:1px;display:grid;place-items:center;transition:.15s}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-dim)}
.opt[aria-pressed="true"] .mk{border-color:var(--accent);background:var(--accent)}
.opt[aria-pressed="true"] .mk::after{content:"";width:7px;height:7px;border-radius:50%;background:#07140d}
.opt.correct{border-color:var(--accent);background:rgba(110,231,160,.12)}
.opt.wrong{border-color:var(--rose);background:rgba(255,107,122,.1)}
.opt.correct .mk{border-color:var(--accent);background:var(--accent)}
.opt.wrong .mk{border-color:var(--rose);background:var(--rose)}
.opt .mk svg{width:11px;height:11px;color:#07140d}
.why{margin-top:10px;font-size:12.5px;color:var(--soft);background:var(--inset);border-left:3px solid var(--cyan);padding:9px 12px;border-radius:0 8px 8px 0}
.why b{color:var(--cyan)}

/* flag / completion */
.flagbox{display:flex;flex-direction:column;gap:10px;border:1px dashed var(--line);border-radius:14px;padding:16px;background:var(--panel-2);margin-top:4px}
.flagbox .fh{display:flex;align-items:center;gap:9px;font-weight:700}
.flagbox .fh svg{width:17px;height:17px;color:var(--accent)}
.flag-in{display:flex;gap:10px;flex-wrap:wrap}
.flag-in input{flex:1;min-width:200px;background:var(--inset);border:1px solid var(--line);border-radius:11px;padding:0 14px;height:44px;font-family:var(--mono);font-size:14px}
.flag-in input.shake{animation:shake .4s;border-color:var(--rose)}
@keyframes shake{25%{transform:translateX(-7px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}}
.verdict{font-size:13px;min-height:19px;font-weight:600}
.verdict.ok{color:var(--accent)}.verdict.no{color:var(--rose)}
.solved-banner{display:flex;align-items:center;gap:12px;padding:15px 18px;border-radius:14px;background:linear-gradient(90deg,rgba(110,231,160,.14),rgba(88,199,224,.08));border:1px solid rgba(110,231,160,.3);margin-bottom:16px}
.solved-banner svg{width:26px;height:26px;color:var(--accent);flex:none}
.solved-banner b{color:var(--accent)}
.solved-banner .next{margin-left:auto}
.solved-banner .fl{font-family:var(--mono);font-size:12px;color:var(--muted)}
.hint{font-size:12.5px;color:var(--muted)}
.hint button{color:var(--cyan);font-weight:600;text-decoration:underline;text-underline-offset:2px}
.hint-text{margin-top:8px;padding:10px 12px;background:var(--inset);border-radius:9px;border:1px solid var(--line);color:var(--soft);font-size:12.5px}
.navline{display:flex;justify-content:space-between;gap:10px;margin-top:24px;padding-top:18px;border-top:1px solid var(--line)}

.spark{position:fixed;top:0;left:0;width:9px;height:9px;z-index:200;pointer-events:none;border-radius:2px}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,24px);opacity:0;background:var(--fg);color:var(--bg);font-weight:700;font-size:13px;padding:11px 18px;border-radius:12px;z-index:150;transition:.35s cubic-bezier(.2,.9,.25,1);pointer-events:none;max-width:calc(100% - 32px)}
.toast.on{transform:translate(-50%,0);opacity:1}
.hide{display:none!important}

@media (max-width:860px){
  .wrap{grid-template-columns:1fr}
  .rail{position:static;max-height:360px;border-right:0;border-bottom:1px solid var(--line)}
  .main{padding:20px 16px 30px}
  .progress-wrap .lbl{display:none}
  .panes{grid-template-columns:1fr}
}
@media (max-width:560px){
  body{padding-inline:8px}
  .app{border-radius:16px}
  .top{padding:12px 14px;gap:10px}
  .brand{font-size:15px}.safe{display:none}
  .bar{width:70px}
  .h1{font-size:22px}
  .main{padding:18px 13px 28px}
  .card{padding:15px}
}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
<!-- HEAD END -->
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 6v6c0 4.5 3.3 7.8 8 9 4.7-1.2 8-4.5 8-9V6l-8-3Z"/><path d="m9 12 2 2 4-4"/></svg></span>
      <span>Кибер<b>·</b>Академия</span>
      <span class="safe">учебная песочница</span>
    </div>
    <div class="right">
      <div class="progress-wrap"><span class="lbl">Прогресс</span><span class="bar"><i id="barFill"></i></span><span class="mono" id="progTxt">0/0</span></div>
      <button class="icnbtn" id="themeBtn" aria-label="Сменить тему"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      <button class="icnbtn" id="resetBtn" aria-label="Сбросить прогресс"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
    </div>
  </header>
  <div class="wrap">
    <nav class="rail" id="rail" aria-label="Уроки"></nav>
    <main class="main" id="main" aria-live="polite"></main>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
const el = (t, c, h) => { const n = document.createElement(t); if (c) n.className = c; if (h != null) n.innerHTML = h; return n; };
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const store = {
  get(k, d){ try { const v = localStorage.getItem("cyberacad:" + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v){ try { localStorage.setItem("cyberacad:" + k, JSON.stringify(v)); } catch {} }
};
const esc = s => String(s).replace(/[&<>]/g, m => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;" }[m]));
const b64 = s => { try { return btoa(unescape(encodeURIComponent(s))); } catch { return ""; } };
const unb64 = s => { try { return decodeURIComponent(escape(atob(String(s).trim()))); } catch { return null; } };
const caesar = (s, k) => s.replace(/[a-z]/gi, c => { const b = c <= "Z" ? 65 : 97; return String.fromCharCode((c.charCodeAt(0) - b + (k % 26 + 26)) % 26 + b); });
const FLAG = id => "FLAG{" + id + "}";

const ICON = {
  shield:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 6v6c0 4.5 3.3 7.8 8 9 4.7-1.2 8-4.5 8-9V6l-8-3Z"/></svg>',

{ id:"intro", track:"Основы", title:"Что такое этичный хакинг", sub:"Образ мышления и правила", diff:"easy",

  <div class="card"><h3>${ICON.shield} Белый, серый, чёрный</h3>

    <p>Профессия называется <code>пентестер</code> или <code>security researcher</code>. Главный навык — не «взлом», а понимание того, как система устроена и где она доверяет данным, которым доверять нельзя.</p></div>

      <li><b>Confidentiality (конфиденциальность)</b> — данные видит только тот, кому положено. Нарушается утечкой.</li>

{ id:"how-internet", track:"Основы", title:"Как работает интернет", sub:"IP, DNS, порты, протоколы", diff:"easy",
  theory:`
  <div class="card"><h3>${ICON.net} Адреса и имена</h3>

{ id:"http", track:"Основы", title:"Анатомия HTTP-запроса", sub:"Как браузер говорит с сервером", diff:"easy",

  lab:{

{ id:"linux", track:"Основы", title:"Командная строка Linux", sub:"Базовые команды пентестера", diff:"easy",
  theory:`
  <div class="card"><h3>${ICON.terminal} Почему Linux</h3>
    <p>Большинство серверов и инструментов безопасности работают в Linux. Минимальный набор команд:</p>
    <ul>
      <li><code>ls</code> — список файлов, <code>cd</code> — перейти в папку, <code>pwd</code> — где я сейчас.</li>
      <li><code>cat file</code> — показать файл, <code>grep слово file</code> — найти строку.</li>
      <li><code>chmod</code> — права доступа, <code>sudo</code> — выполнить от администратора (root).</li>
      <li><code>man команда</code> — встроенная справка.</li>
    </ul></div>
  <div class="card"><h3>${ICON.shield} Права и root</h3>
    <p>В Linux всё — файлы, и у каждого есть права на чтение/запись/выполнение. <code>root</code> — всемогущий пользователь. Захват root на чужой машине (<code>privilege escalation</code>) — частая цель атаки, а для защитника — то, что нужно предотвратить.</p></div>
  <div class="defend"><b>Практика.</b> Работайте под обычным пользователем, а не под root. Повышайте права только когда действительно нужно — принцип наименьших привилегий.</div>`,
  flag:"linux_cli_basics",
  lab:{
    render(){ return `
    <div class="card"><h3>${ICON.terminal} Задание</h3><p>Перед вами настоящая (учебная) оболочка. Осмотритесь и найдите флаг: подсказка — в каталоге есть скрытый файл. Нужные команды: <code>ls</code>, <code>ls -a</code>, <code>cat</code>, <code>pwd</code>, <code>whoami</code>, <code>grep</code>, <code>help</code>.</p></div>
    <div class="term"><div class="term-head"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="ttl">student@academy: ~ — учебная оболочка</span></div>
      <div class="term-body"><pre class="out" id="shOut"></pre>
        <div class="row" style="margin-top:10px;flex-wrap:nowrap"><span class="mono c-s">$</span><input type="text" id="shIn" class="inp mono" style="flex:1;border-radius:9px" placeholder="введите команду и Enter" autocomplete="off" spellcheck="false"></div>
      </div></div>
    <div class="defend"><b>Для защитника.</b> Скрытые файлы (начинаются с точки) и файлы с правами на чтение для всех — частый источник утечки секретов и ключей. Проверяйте права: <code>ls -la</code>.</div>`; },
    wire(){
      const FS = { "notes.txt":"список дел: обновить сервер", "readme.md":"учебная машина Кибер-Академии", ".secret":"внутри: "+FLAG("linux_cli_basics") };
      const HELP = "доступно: ls, ls -a, cat <файл>, pwd, whoami, grep <слово> <файл>, clear, help";
      const hist = [["c-c","# введите help, чтобы увидеть список команд"]];
      const print = () => renderLines($("#shOut"), hist);
      const push = (cls, t) => { hist.push([cls, t]); if (hist.length > 60) hist.shift(); };
      print();
      const run = raw => {
        const cmd = raw.trim(); if (!cmd) return;
        push("c-i", "$ " + cmd);
        const [c, ...rest] = cmd.split(/\s+/); const arg = rest.join(" ");
        if (c === "ls" && (arg === "-a" || arg === "-la" || arg === "-al")) push("", Object.keys(FS).join("   "));
        else if (c === "ls") push("", Object.keys(FS).filter(f => !f.startsWith(".")).join("   "));
        else if (c === "pwd") push("", "/home/student");
        else if (c === "whoami") push("", "student  (обычный пользователь, не root)");
        else if (c === "help") push("c-c", HELP);
        else if (c === "clear") { hist.length = 0; }
        else if (c === "cat") {
          if (!arg) push("c-e", "cat: укажите файл");
          else if (FS[arg] != null) { const hit = /FLAG\{/.test(FS[arg]); push(hit ? "c-s" : "", FS[arg]); }
          else push("c-e", "cat: " + arg + ": файл не найден (подсказка: попробуйте ls -a)");
        }
        else if (c === "grep") {
          const word = rest[0], file = rest[1];
          if (!file || FS[file] == null) push("c-e", "grep: укажите слово и существующий файл");
          else { const line = FS[file]; if (line.includes(word)) { const hit = /FLAG\{/.test(line); push(hit ? "c-s" : "", line); } else push("c-c", "(совпадений нет)"); }
        }
        else push("c-e", c + ": команда не найдена. введите help");
        print(); const b = $("#shOut").parentElement; b.scrollTop = b.scrollHeight;
      };
      $("#shIn").addEventListener("keydown", e => { if (e.key === "Enter"){ run(e.target.value); e.target.value = ""; } });
    }}},

    <div class="defend"><b>Защита.</b> Стойкость шифра должна зависеть только от ключа, а не от секретности алгоритма (принцип Керкгоффса), и ключей должно быть астрономически много. Поэтому используют AES-256.</div>`; },
    wire(){

{ id:"symmetric", track:"Криптография", title:"Симметричное шифрование", sub:"Один ключ на обе стороны (AES)", diff:"med",
  theory:`
  <div class="card"><h3>${ICON.key} Один общий ключ</h3>
    <p>В симметричном шифровании один и тот же ключ и шифрует, и расшифровывает. Главный современный стандарт — <b>AES</b> (128/256 бит). Он быстрый и стойкий: перебрать ключ AES-256 невозможно за время жизни Вселенной.</p>
    <p>Проблема одна — как передать ключ собеседнику так, чтобы его не перехватили? Это называют <b>задачей распространения ключей</b>.</p></div>
  <div class="card"><h3>${ICON.shield} Режимы работы</h3>
    <p>Важен не только шифр, но и режим. Режим <code>ECB</code> плох — одинаковые блоки дают одинаковый результат, и картинка «просвечивает». Используют режимы с уникальным вектором (IV): <code>GCM</code>, <code>CBC</code>. GCM вдобавок проверяет целостность.</p></div>
  <div class="defend"><b>Практика.</b> Не изобретайте свой шифр и не используйте ECB. Берите проверенные библиотеки и AES-GCM со случайным IV для каждого сообщения.</div>`,
  quiz:[
    {q:"Что характерно для симметричного шифрования?", a:["Два разных ключа","Один ключ и для шифрования, и для расшифровки","Ключ не нужен","Работает только с текстом"], c:1, why:"Симметричное = один общий секретный ключ на обе стороны."},
    {q:"Почему режим ECB небезопасен?", a:["Слишком медленный","Одинаковые блоки шифруются одинаково и выдают структуру","Требует интернет","Не поддерживает русский язык"], c:1, why:"В ECB нет IV, поэтому повторяющиеся данные видны в шифртексте."},
  ]},
{ id:"asymmetric", track:"Криптография", title:"Асимметричное шифрование", sub:"Публичный и приватный ключ (RSA)", diff:"med",
  theory:`
  <div class="card"><h3>${ICON.key} Пара ключей</h3>
    <p>Здесь два связанных ключа: <b>публичный</b> (его раздают всем) и <b>приватный</b> (хранят в тайне). Что зашифровано публичным — расшифровывается только приватным. Так решается задача передачи ключа: не нужно заранее делиться секретом.</p>
    <p>Примеры: <b>RSA</b>, <b>ECC</b>. Асимметрия медленнее симметрии, поэтому на практике ею лишь обмениваются симметричным ключом, а дальше шифруют быстрым AES (гибридная схема — так работает HTTPS).</p></div>
  <div class="card"><h3>${ICON.shield} Цифровая подпись</h3>
    <p>Если наоборот — подписать приватным ключом, а проверить публичным, — получится <b>цифровая подпись</b>: доказательство, что сообщение от владельца ключа и не изменено. На этом держатся сертификаты сайтов и обновления ПО.</p></div>
  <div class="defend"><b>Практика.</b> Приватный ключ никогда не покидает владельца и не передаётся по сети. Утечка приватного ключа = полная компрометация.</div>`,
  flag:"only_private_key_unlocks",
  lab:{
    render(){ return `
    <div class="card"><h3>${ICON.key} Задание</h3><p>Зашифруйте сообщение <b>публичным</b> ключом получателя, а затем попробуйте расшифровать. Проверьте: подходит только <b>приватный</b> ключ, а чужой/публичный — нет.</p></div>
    <div class="lab">
      <div class="field"><label>Сообщение</label><input type="text" id="akmsg" class="inp" value="перевод 5000 — подтверждаю"></div>
      <div class="row"><button class="btn primary" id="akenc">${ICON.lock} Зашифровать публичным ключом</button></div>
      <div class="field"><label>Шифртекст</label><div class="inp mono" id="akct" style="word-break:break-all;min-height:20px"></div></div>
      <div class="field"><label>Чем расшифровать?</label><div class="chipset" id="akkeys"></div></div>
      <div class="term"><div class="term-head"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="ttl">decrypt — попробуй разные ключи</span></div><div class="term-body"><pre class="out" id="akout"></pre></div></div>
    </div>
    <div class="defend"><b>Вывод.</b> Публичным ключом только шифруют — расшифровать им нельзя. Поэтому его и раздают всем. Расшифровать может лишь владелец приватного ключа.</div>`; },
    wire(){
      // toy reversible "asymmetric": public = shift +7, private = shift -7; wrong keys give garbage
      const PUB = 7, PRIV = -7, ATTACKER = -3;
      let ct = "";
      const enc = () => { ct = caesar($("#akmsg").value, PUB); $("#akct").textContent = ct || "(введите сообщение)"; renderLines($("#akout"), [["c-c","# зашифровано публичным ключом. теперь выберите ключ для расшифровки"]]); };
      $("#akenc").onclick = enc; enc();
      const KEYS = [["Приватный ключ получателя", PRIV, true], ["Публичный ключ (тот же)", PUB, false], ["Чужой приватный ключ", ATTACKER, false]];
      const w = $("#akkeys");
      KEYS.forEach(([name, k, ok]) => { const b = el("button","chip",name); b.onclick = () => {
        if (!ct){ renderLines($("#akout"), [["c-e","# сначала зашифруйте сообщение"]]); return; }
        const dec = caesar(ct, k);
        if (ok) renderLines($("#akout"), [["c-c","# ключ: "+name],["c-s","✓ расшифровано: "+dec],["c-s","flag -> "+FLAG("only_private_key_unlocks")]]);
        else renderLines($("#akout"), [["c-c","# ключ: "+name],["c-e","✗ не тот ключ — получается мусор:"],["c-e",dec]]);
      }; w.appendChild(b); });
    }}},
{ id:"hash", track:"Криптография", title:"Пароли и хеши", sub:"Почему пароли не хранят как есть", diff:"hard",
  theory:`
  <div class="card"><h3>${ICON.lock} Односторонняя функция</h3>
    <p>Хеш превращает данные в строку фиксированной длины, и обратно его не восстановить. В базе хранят хеш пароля, а не сам пароль. Но одинаковые пароли дают одинаковый хеш — их выдаёт «радужная таблица». Спасает <b>соль</b>: случайная добавка к каждому паролю.</p>
    <p>Ниже — учебная (<b>не</b> криптостойкая) хеш-функция для наглядности.</p></div>`,
  lab:{
    render(){ return `
    <div class="lab">
      <div class="field"><label>Пароль</label><input type="text" id="pw" value="123456" class="inp"></div>
      <div class="row"><label style="display:flex;gap:8px;align-items:center;color:var(--soft);font-size:13px"><input type="checkbox" id="useSalt" style="accent-color:var(--accent)"> добавить случайную соль</label></div>
      <div class="kv"><span class="k">соль</span><span class="v" id="saltV">—</span><span class="k">хеш</span><span class="v c-i" id="hashV"></span></div>
      <div class="row"><button class="btn primary" id="hashBtn">${ICON.arrow} Посчитать</button><button class="btn ghost" id="rainbow">Сравнить с «радужной таблицей»</button></div>
    </div>
    <div class="term hide" style="margin-top:14px" id="rbTerm"><div class="term-head"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="ttl">rainbow-table lookup</span></div><div class="term-body"><pre class="out" id="rbOut"></pre></div></div>
    <div class="defend"><b>Защита.</b> Храните пароли как хеш с уникальной солью и «медленным» алгоритмом — <code>bcrypt</code>, <code>scrypt</code>, <code>argon2</code>. Медленность специально мешает перебору.</div>`; },
    wire(){
      const toy=s=>{let h=0x811c9dc5;for(const ch of s){h^=ch.charCodeAt(0);h=Math.imul(h,0x01000193)>>>0;}return("00000000"+h.toString(16)).slice(-8);};
      const COMMON={}; COMMON[toy("123456")]="123456"; COMMON[toy("password")]="password"; COMMON[toy("qwerty")]="qwerty";
      let salt="";
      const calc=()=>{salt=$("#useSalt").checked?Math.random().toString(16).slice(2,8):"";$("#saltV").textContent=salt||"— (без соли, опасно)";const h=toy($("#pw").value+salt);$("#hashV").textContent=h;return h;};
      $("#useSalt").onchange=calc;$("#pw").oninput=calc;$("#hashBtn").onclick=calc;calc();
      $("#rainbow").onclick=()=>{const h=calc();$("#rbTerm").classList.remove("hide");const lines=[["c-c","# ищем хеш "+h+" в готовой таблице…"]];
        if(!salt&&COMMON[h]){lines.push(["c-e","НАЙДЕН! пароль = "+COMMON[h]+"  — хеш без соли бесполезен"],["c-c","# добавь соль, чтобы получить флаг:"]);}
        else if(!salt){lines.push(["c-n","в учебной таблице нет, но реальная таблица огромна"],["c-c","# всё равно добавь соль — это правильно:"]);}
        else{lines.push(["c-s","НЕ НАЙДЕН — соль сделала хеш уникальным ✓"],["c-s","flag -> "+FLAG("salt_your_hashes")]);}
        typeOut($("#rbOut"),lines,18);};
    }},
  flag:"salt_your_hashes" },
{ id:"tls", track:"Криптография", title:"HTTPS и TLS", sub:"Откуда замочек в браузере", diff:"med",
  theory:`
  <div class="card"><h3>${ICON.lock} Что даёт HTTPS</h3>
    <p>HTTPS — это HTTP поверх <b>TLS</b>. Он обеспечивает сразу три вещи: <b>шифрование</b> (трафик не прочитать по дороге), <b>целостность</b> (не подменить) и <b>аутентификацию сервера</b> (вы говорите именно с тем сайтом).</p></div>
  <div class="card"><h3>${ICON.key} Рукопожатие и сертификаты</h3>
    <p>При подключении браузер и сервер договариваются о ключах (handshake): асимметрией обмениваются секретом, дальше общаются быстрым симметричным шифром. Сервер доказывает, кто он, <b>сертификатом</b>, подписанным доверенным центром (CA). Если сертификат просрочен или не тот — браузер предупреждает.</p></div>
  <div class="defend"><b>Практика.</b> «Замочек» означает лишь шифрование канала, а не что сайт честный — фишинговые сайты тоже бывают на HTTPS. Всегда проверяйте сам домен.</div>`,
  quiz:[
    {q:"Что НЕ обеспечивает HTTPS сам по себе?", a:["Шифрование канала","Что владелец сайта — честный человек","Целостность данных","Проверку, что это нужный сервер"], c:1, why:"HTTPS защищает канал, но не гарантирует добросовестность владельца — фишинг бывает на HTTPS."},
    {q:"Чем сервер доказывает свою подлинность?", a:["Паролем","Сертификатом, подписанным доверенным центром (CA)","Капчей","IP-адресом"], c:1, why:"Доверие строится на цепочке сертификатов до доверенного CA."},
  ]},

{ id:"inspect", track:"Веб-уязвимости (OWASP)", title:"Нельзя доверять клиенту", sub:"Секреты во фронтенде", diff:"med",

{ id:"sqli", track:"Веб-уязвимости (OWASP)", title:"SQL-инъекция (симуляция)", sub:"Когда ввод становится командой", diff:"hard",
  theory:`
  <div class="card"><h3>${ICON.db} Данные смешались с кодом</h3>
    <p>Если сервер склеивает запрос к базе прямо из пользовательского ввода, ввод может «вырваться» из строки и стать частью команды. Это одна из самых классических веб-уязвимостей. Здесь безопасный <b>симулятор</b>: базы нет, ввод просто подставляется в шаблон, и мы показываем, что бы произошло.</p></div>`,
  lab:{
    render(){ return `
    <div class="lab">
      <div class="field"><label>Логин</label><input type="text" id="user" value="admin" class="inp"></div>
      <div class="field"><label>Пароль</label><input type="text" id="pass" value="hunter2" class="inp"></div>
      <div class="chipset"><button class="chip" id="payload">подставить payload: <span class="mono">' OR '1'='1</span></button></div>
      <div class="row"><button class="btn primary" id="login">${ICON.arrow} Выполнить запрос</button></div>
    </div>
    <div class="term" style="margin-top:14px"><div class="term-head"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="ttl">vulnerable-login — симулятор</span></div><div class="term-body"><pre class="out" id="sqlOut"></pre></div></div>
    <div class="defend"><b>Защита.</b> Параметризованные запросы (prepared statements): <code>WHERE login = ?</code> с передачей значения отдельно. Тогда ввод всегда остаётся данными. Плюс валидация и минимальные права БД.</div>`; },
    wire(){
      const run=()=>{const u=$("#user").value,p=$("#pass").value;const q="SELECT * FROM users WHERE login='"+u+"' AND pass='"+p+"';";
        const inj=/'\s*OR\s*'?1'?\s*=\s*'?1/i.test(u+" "+p)||/'\s*OR\s*1=1/i.test(u+" "+p);
        const lines=[["c-c","# сервер склеил запрос из ввода:"],["c-k",highlightSQL(q)]];
        if(inj){lines.push(["c-c","# условие стало всегда истинным → вернулись ВСЕ строки:"],["c-s","login=admin  role=superuser   ✓ вход выполнен"],["c-e","# уязвимость сработала (в симуляторе)."],["c-s","flag -> "+FLAG("or_1_equals_1")]);}
        else{lines.push(["c-c","# обычная проверка: строка не найдена"],["c-e","✗ неверный логин или пароль"],["c-c","# подсказка: нажми чип с payload и выполни снова"]);}

      renderLines($("#sqlOut"),[["c-c","# введи данные и выполни запрос"]]);
    }},
  flag:"or_1_equals_1" },
{ id:"xss", track:"Веб-уязвимости (OWASP)", title:"XSS — межсайтовый скриптинг", sub:"Чужой JavaScript на вашей странице", diff:"hard",
  theory:`
  <div class="card"><h3>${ICON.code} Ввод, ставший кодом страницы</h3>

    <p>Ниже безопасная демонстрация: мы <b>никогда</b> не выполняем ваш ввод, а показываем, как один и тот же комментарий выглядит на уязвимом и на защищённом сайте.</p></div>`,
  lab:{
    render(){ return `
    <div class="lab">

      <div class="panes">
        <div class="pane bad"><div class="ph">Уязвимый сайт (вывод как есть)</div><div class="pb mono" id="xbad"></div></div>

      </div>
    </div>
    <div class="defend"><b>Защита.</b> Экранируйте вывод (<code>&lt;</code> → <code>&amp;lt;</code>) в нужном контексте, включите <code>Content-Security-Policy</code>, помечайте cookie флагом <code>HttpOnly</code>, чтобы их не достал скрипт. Не вставляйте пользовательский ввод через <code>innerHTML</code>.</div>`; },
    wire(){
      const run=()=>{const raw=$("#xin").value;const hasScript=/<\s*script/i.test(raw)||/on\w+\s*=/i.test(raw);
        // SAFE: both panes only ever show ESCAPED text; the "vulnerable" pane just annotates what WOULD happen
        $("#xbad").innerHTML = (hasScript?'<span class="c-e">⚠ сработал бы чужой код: '+'</span>':'')+esc(raw);
        $("#xgood").innerHTML = '<span class="c-s">безопасно показан как текст:</span><br>'+esc(raw);
        if(hasScript) typeOut(ensureTerm(),[["c-c","# на уязвимом сайте выполнился бы ваш скрипт."],["c-c","# на защищённом он остался текстом. флаг:"],["c-s","flag -> "+FLAG("xss_needs_output_encoding")]],16);
      };
      $("#xrun").onclick=run;
      function ensureTerm(){ let t=$("#xterm"); if(!t){ const w=el("div","term"); w.id="xtermw"; w.style.marginTop="14px"; w.innerHTML='<div class="term-head"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="ttl">xss — что произошло</span></div><div class="term-body"><pre class="out" id="xterm"></pre></div>'; $("#xgood").closest(".lab").appendChild(w); t=$("#xterm"); } return t; }
      run();
    }},
  flag:"xss_needs_output_encoding" },
{ id:"csrf", track:"Веб-уязвимости (OWASP)", title:"CSRF — подделка запроса", sub:"Действие от вашего имени", diff:"hard",
  theory:`
  <div class="card"><h3>${ICON.globe} Браузер слишком доверчив</h3>
    <p>Браузер автоматически прикладывает ваши cookie к каждому запросу на сайт. Если вы залогинены в банке и зашли на вредную страницу, она может тихо отправить запрос в банк от вашего имени — браузер приложит вашу сессию. Это <b>CSRF</b> (подделка межсайтового запроса).</p>
    <p>Атака работает на «изменяющих» действиях: перевод денег, смена пароля, удаление.</p></div>
  <div class="defend"><b>Защита.</b> <code>CSRF-токен</code> — случайное значение в форме, которого чужой сайт не знает. Плюс cookie с атрибутом <code>SameSite</code>, и проверка, что важные действия идут методом POST с проверкой источника.</div>`,
  quiz:[
    {q:"Почему CSRF вообще возможна?", a:["Пароли слишком простые","Браузер сам прикладывает cookie сессии к запросу","Сервер медленный","Нет антивируса"], c:1, why:"Автоматическая отправка cookie позволяет чужой странице действовать от вашего имени."},
    {q:"Что надёжно защищает от CSRF?", a:["Длинный пароль","CSRF-токен и cookie SameSite","HTTPS сам по себе","Капча на входе"], c:1, why:"Секретный токен, которого чужой сайт не знает, + SameSite-cookie."},
  ]},
{ id:"idor", track:"Веб-уязвимости (OWASP)", title:"IDOR и контроль доступа", sub:"Чужие данные по чужому id", diff:"hard",
  theory:`
  <div class="card"><h3>${ICON.db} Угадал номер — получил чужое</h3>
    <p><b>IDOR</b> (небезопасная прямая ссылка на объект) — когда доступ к данным определяется только номером в запросе, а сервер не проверяет, ваш ли это объект. Поменяли <code>id=1001</code> на <code>1002</code> — и увидели чужой заказ. Это частный случай «сломанного контроля доступа» — уязвимости №1 в OWASP Top 10.</p>
    <p>Ниже безопасный симулятор API: ваш настоящий id — <code>1001</code>.</p></div>`,
  lab:{
    render(){ return `
    <div class="lab">
      <div class="field"><label>Запрос к API</label>
        <div class="row"><span class="inp mono" style="flex:1;min-width:200px">GET /api/orders?user_id=<span id="uid" class="c-n">1001</span></span>
          <button class="chip" id="minus">−1</button><button class="chip" id="plus">+1</button></div></div>

    </div>
    <div class="term" style="margin-top:14px"><div class="term-head"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="ttl">broken-access — симулятор</span></div><div class="term-body"><pre class="out" id="idorOut"></pre></div></div>
    <div class="defend"><b>Защита.</b> Сервер должен проверять право на <b>каждый</b> объект: «принадлежит ли заказ текущему пользователю?». Не полагайтесь на то, что номер «не угадают». Используйте непредсказуемые идентификаторы и серверную авторизацию.</div>`; },
    wire(){
      let id=1001;const MINE=1001;
      const OWN={name:"Ваш заказ",items:"наушники, чехол",sum:"4 900 ₽"};
      const upd=()=>{$("#uid").textContent=id;};
      const go=()=>{const lines=[["c-k","GET /api/orders?user_id="+id]];
        if(id===MINE){lines.push(["c-s","200 OK — "+OWN.name],["","items: "+OWN.items+"  sum: "+OWN.sum]);}
        else{lines.push(["c-e","200 OK — ЧУЖОЙ заказ пользователя #"+id+" (сервер не проверил доступ!)"],["","items: секретный подарок  sum: 12 000 ₽"],["c-c","# так выглядит IDOR. флаг:"],["c-s","flag -> "+FLAG("check_access_server_side")]);}
        typeOut($("#idorOut"),lines,16);};
      $("#plus").onclick=()=>{id++;upd();};$("#minus").onclick=()=>{id--;upd();};$("#go").onclick=go;
      renderLines($("#idorOut"),[["c-c","# измени user_id на чужой и отправь"]]);
    }},
  flag:"check_access_server_side" },
{ id:"authn", track:"Веб-уязвимости (OWASP)", title:"Аутентификация и сессии", sub:"Вход, cookie, перебор", diff:"med",
  theory:`
  <div class="card"><h3>${ICON.key} Кто вы и как сайт это помнит</h3>
    <p><b>Аутентификация</b> — доказать, кто вы (пароль, код, ключ). <b>Авторизация</b> — что вам можно. После входа сервер выдаёт <b>сессионный токен</b> (обычно в cookie), который браузер шлёт с каждым запросом вместо пароля.</p></div>
  <div class="card"><h3>${ICON.bug} Типичные ошибки</h3>
    <ul>
      <li>Нет защиты от перебора пароля (<code>brute force</code>, <code>credential stuffing</code> чужими утечками).</li>
      <li>Токен сессии предсказуем или не сбрасывается при выходе.</li>
      <li>Нет второго фактора (2FA) на важных аккаунтах.</li>
    </ul></div>
  <div class="defend"><b>Защита.</b> Ограничение попыток входа (rate limiting), блокировки, длинные случайные токены, флаги cookie <code>HttpOnly</code>+<code>Secure</code>+<code>SameSite</code>, обязательный 2FA и смена токена после логина.</div>`,
  flag:"rate_limit_stops_brute_force",
  lab:{
    render(){ return `
    <div class="card"><h3>${ICON.key} Задание</h3><p>Запустите перебор паролей по словарю против учебного входа. Сначала защита выключена — перебор проходит. Затем включите <b>лимит попыток</b> и запустите снова: сравните результат.</p></div>
    <div class="lab">
      <div class="row"><label style="display:flex;gap:8px;align-items:center;color:var(--soft);font-size:13px"><input type="checkbox" id="rl" style="accent-color:var(--accent)"> включить rate limiting (5 попыток)</label></div>
      <div class="row"><button class="btn primary" id="brun">${ICON.terminal} Запустить перебор</button></div>
      <div class="term"><div class="term-head"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="ttl">credential-bruteforce — симулятор</span></div><div class="term-body"><pre class="out" id="bout"></pre></div></div>
    </div>
    <div class="defend"><b>Вывод.</b> Лимит попыток и блокировка делают перебор непрактичным, а 2FA спасает, даже если пароль угадан. Это и есть защита от brute force и credential stuffing.</div>`; },
    wire(){
      const DICT = ["123456","qwerty","password","letmein","dragon","sunshine","hunter2","admin","iloveyou","matrix"];
      const REAL = "hunter2";
      $("#brun").onclick = () => {
        const limited = $("#rl").checked;
        const lines = [["c-c","# атака по словарю на аккаунт admin…"]];
        let tries = 0, done = false;
        for (const p of DICT){
          tries++;
          if (limited && tries > 5){ lines.push(["c-e","⛔ попытка "+tries+": аккаунт заблокирован (превышен лимит)"]); done = true; break; }
          if (p === REAL){ lines.push(["c-s","попытка "+tries+": "+p+"   ← ПОДОШЁЛ"]); done = true;
            if (limited) lines.push(["c-c","# (успели до лимита, но при 2FA этого мало)"]);
            else { lines.push(["c-e","# без защиты пароль подобран. а теперь включите rate limiting."]); }
            break; }
          lines.push(["c-c","попытка "+tries+": "+p+"  ✗"]);
        }
        if (limited && done && tries > 5) lines.push(["c-s","# перебор остановлен до подбора пароля. флаг:"],["c-s","flag -> "+FLAG("rate_limit_stops_brute_force")]);
        typeOut($("#bout"), lines, 90);
      };
      renderLines($("#bout"), [["c-c","# нажмите «Запустить перебор». сначала без защиты, потом с лимитом"]]);
    }}},
{ id:"headers", track:"Веб-уязвимости (OWASP)", title:"Заголовки безопасности", sub:"Защита в одну строку", diff:"med",
  theory:`
  <div class="card"><h3>${ICON.shield} Что умеют HTTP-заголовки</h3>
    <p>Сервер может прислать заголовки, которые включают защиту прямо в браузере. Соберите «профиль безопасности» ниже и доведите оценку до 100%.</p>
    <ul>
      <li><code>Content-Security-Policy</code> — разрешает скрипты только из доверенных мест (главная защита от XSS).</li>
      <li><code>Strict-Transport-Security</code> (HSTS) — только HTTPS, без отката на HTTP.</li>
      <li><code>X-Frame-Options</code> — запрет встраивать сайт в чужой iframe (защита от кликджекинга).</li>
      <li><code>X-Content-Type-Options: nosniff</code> — браузер не «угадывает» тип файла.</li>
    </ul></div>`,
  lab:{
    render(){ return `
    <div class="lab">
      <div class="field"><label>Включить заголовки</label><div class="chipset" id="hset"></div></div>
      <div class="field"><label>Оценка защиты</label><div class="meter"><i id="hmeter"></i></div><div class="kv" style="margin-top:8px"><span class="k">score</span><span class="v mono" id="hscore">0%</span></div></div>
      <div class="term"><div class="term-head"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="ttl">response headers</span></div><div class="term-body"><pre class="out" id="hout"></pre></div></div>
    </div>
    <div class="defend"><b>Практика.</b> Эти заголовки бесплатны и ставятся на уровне сервера/прокси. Начните с CSP и HSTS — они закрывают самые частые классы атак.</div>`; },
    wire(){
      const H=[["Content-Security-Policy","XSS"],["Strict-Transport-Security","downgrade на HTTP"],["X-Frame-Options","кликджекинг"],["X-Content-Type-Options","MIME-sniffing"]];
      const on=new Set();const w=$("#hset");
      H.forEach(([k])=>{const b=el("button","chip",k);b.setAttribute("aria-pressed","false");b.onclick=()=>{on.has(k)?on.delete(k):on.add(k);b.setAttribute("aria-pressed",on.has(k));draw();};w.appendChild(b);});
      function draw(){const pct=Math.round(on.size/H.length*100);$("#hscore").textContent=pct+"%";const m=$("#hmeter");m.style.width=pct+"%";m.style.background=pct<50?"var(--rose)":pct<100?"var(--amber)":"var(--accent)";
        const lines=[["c-s","HTTP/1.1 200 OK"]];H.forEach(([k,risk])=>{if(on.has(k))lines.push(["c-i",k+": …   ← закрывает "+risk]);else lines.push(["c-e","(нет) "+k+"   ← открыт риск: "+risk]);});
        if(on.size===H.length)lines.push(["c-c","# все ключевые заголовки на месте. флаг:"],["c-s","flag -> "+FLAG("defense_in_the_headers")]);
        renderLines($("#hout"),lines);}
      draw();
    }},
  flag:"defense_in_the_headers" },
{ id:"jwt", track:"Веб-уязвимости (OWASP)", title:"JWT-токены", sub:"Что внутри и чему доверять", diff:"hard",
  theory:`
  <div class="card"><h3>${ICON.key} Три части через точку</h3>
    <p><b>JWT</b> — популярный формат токена: <code>header.payload.signature</code>. Первые две части — это просто <b>Base64</b> с данными (кто пользователь, его роль, срок). Они <b>не зашифрованы</b>, их читает кто угодно. Защищает только <b>подпись</b>: изменить payload нельзя, не зная секретного ключа сервера.</p></div>`,
  lab:{
    render(){ return `
    <div class="lab">
      <div class="field"><label>JWT-токен</label><textarea id="jwtin" class="mono"></textarea></div>
      <div class="row"><button class="btn primary" id="jdec">${ICON.arrow} Декодировать</button></div>
      <div class="field"><label>Payload (читается без ключа!)</label><div class="inp mono" id="jpay" style="white-space:pre-wrap;word-break:break-all"></div></div>
    </div>
    <div class="defend"><b>Защита.</b> Не кладите в JWT секреты — payload публичен. Всегда проверяйте подпись и отвергайте <code>alg: none</code>. Храните токен безопасно и делайте короткий срок жизни + механизм отзыва.</div>`; },
    wire(){
      const payload={sub:"1001",role:"user",flag:FLAG("jwt_payload_is_readable")};
      const tok=b64('{"alg":"HS256","typ":"JWT"}')+"."+b64(JSON.stringify(payload))+".s7gP_fakeSignature_not_verifiable";
      $("#jwtin").value=tok;
      $("#jdec").onclick=()=>{const parts=$("#jwtin").value.split(".");const p=unb64(parts[1]||"");
        try{const o=JSON.parse(p);$("#jpay").textContent=JSON.stringify(o,null,2);}catch{$("#jpay").textContent=p||"⚠ не удалось декодировать";}};
      $("#jdec").onclick();
    }},
  flag:"jwt_payload_is_readable" },
{ id:"upload", track:"Веб-уязвимости (OWASP)", title:"Загрузка файлов и path traversal", sub:"Опасные файлы и ../", diff:"hard",
  theory:`
  <div class="card"><h3>${ICON.bug} Два риска при работе с файлами</h3>
    <p><b>Опасная загрузка.</b> Если сайт принимает любые файлы и кладёт их в доступную папку, злоумышленник загрузит исполняемый скрипт и запустит его на сервере.</p>
    <p><b>Path traversal (обход пути).</b> Если имя файла берут из запроса без проверки, строка вроде <code>../../etc/passwd</code> выведет из папки и даст доступ к системным файлам.</p></div>
  <div class="defend"><b>Защита.</b> Белый список расширений и MIME, переименование файла в случайное имя, хранение вне веб-корня, запрет выполнения в папке загрузок. Для путей — нормализовать и запрещать <code>..</code>, работать только внутри разрешённой директории.</div>`,
  quiz:[
    {q:"Чем опасна строка ../../etc/passwd в имени файла?", a:["Ничем","Выводит за пределы папки к системным файлам (path traversal)","Это валидный пароль","Ускоряет загрузку"], c:1, why:"`..` поднимается вверх по дереву каталогов — классический обход пути."},
    {q:"Как безопасно принимать загрузки?", a:["Доверять расширению из имени","Белый список типов, случайное имя, хранить вне веб-корня, запрет выполнения","Разрешить любые файлы","Проверять только размер"], c:1, why:"Комбинация мер; доверять расширению в имени нельзя — его подделывают."},
  ]},
{ id:"ssrf", track:"Веб-уязвимости (OWASP)", title:"SSRF — запрос от имени сервера", sub:"Сервер лезет, куда не надо", diff:"hard",
  theory:`
  <div class="card"><h3>${ICON.net} Сервер как прокси атакующего</h3>
    <p><b>SSRF</b> (подделка запроса на стороне сервера): функция вроде «загрузить картинку по URL» заставляет сервер сходить по адресу, который задал пользователь. Злоумышленник подставляет внутренний адрес — <code>http://169.254.169.254/</code> (облачные метаданные) или <code>http://localhost:admin</code> — и сервер, находясь внутри сети, достаёт то, что снаружи закрыто.</p></div>
  <div class="defend"><b>Защита.</b> Белый список разрешённых адресов/доменов, запрет внутренних диапазонов (localhost, 169.254.*, 10.*, 192.168.*), отдельная сеть без доступа к метаданным, проверка после разрешения DNS.</div>`,
  flag:"server_fetched_the_secret",
  lab:{
    render(){ return `
    <div class="card"><h3>${ICON.net} Задание</h3><p>Это функция «предпросмотр по ссылке»: сервер сам сходит по указанному URL. Попробуйте обычный сайт, а затем внутренний адрес облачных метаданных <code>http://169.254.169.254/</code> — и увидите, что достаёт сервер изнутри сети.</p></div>
    <div class="lab">
      <div class="field"><label>URL для предпросмотра</label><input type="text" id="ssrfurl" class="inp" value="https://example.com/logo.png"></div>
      <div class="chipset"><button class="chip" id="ssrfhint">подставить внутренний адрес</button></div>
      <div class="row"><button class="btn primary" id="ssrfgo">${ICON.arrow} Загрузить на сервере</button></div>
      <div class="term"><div class="term-head"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="ttl">server-side fetch — симулятор</span></div><div class="term-body"><pre class="out" id="ssrfout"></pre></div></div>
    </div>
    <div class="defend"><b>Вывод.</b> Сервер стоит внутри сети и видит то, что закрыто снаружи. Без белого списка и запрета внутренних диапазонов он по вашей просьбе достаёт ключи из метаданных. Это и есть SSRF.</div>`; },
    wire(){
      $("#ssrfhint").onclick = () => { $("#ssrfurl").value = "http://169.254.169.254/latest/meta-data/"; };
      $("#ssrfgo").onclick = () => {
        const u = $("#ssrfurl").value.trim();
        const internal = /169\.254\.169\.254|localhost|127\.0\.0\.1|10\.|192\.168\.|\[::1\]/i.test(u);
        const lines = [["c-c","# сервер выполняет запрос: GET "+esc(u)]];
        if (internal){
          lines.push(["c-e","200 OK — доступ к внутренним метаданным облака!"],
            ["","iam/security-credentials/role:"],
            ["c-n",'  {"AccessKeyId":"AKIA…","SecretAccessKey":"'+FLAG("server_fetched_the_secret")+'"}'],
            ["c-e","# снаружи этот адрес недоступен, но сервер-то внутри. флаг выше."]);
        } else {
          lines.push(["c-s","200 OK — image/png, 24 KB (обычный внешний ресурс)"],["c-c","# безопасно. попробуйте внутренний адрес 169.254.169.254"]);
        }
        typeOut($("#ssrfout"), lines, 18);
      };
      renderLines($("#ssrfout"), [["c-c","# введите URL и нажмите «Загрузить на сервере»"]]);
    }}},
{ id:"cmdi", track:"Веб-уязвимости (OWASP)", title:"Внедрение команд ОС", sub:"Ввод уходит в системный вызов", diff:"hard",
  theory:`
  <div class="card"><h3>${ICON.terminal} Когда ввод попадает в shell</h3>
    <p>Если сервер строит системную команду из пользовательского ввода — например <code>ping [адрес]</code> — то ввод <code>8.8.8.8; rm -rf /</code> выполнит и ping, и вторую команду. Символы <code>; | &amp;&amp; $( )</code> разделяют команды в shell. Это <b>command injection</b> — родственник SQL-инъекции, но на уровне операционной системы.</p></div>
  <div class="defend"><b>Защита.</b> Не собирайте команды из строк. Вызывайте программы напрямую с аргументами-массивом (без оболочки), проверяйте ввод по белому списку, работайте с минимальными правами. Лучший вариант — вообще обойтись без вызова shell.</div>`,
  flag:"semicolon_runs_a_second_command",
  lab:{
    render(){ return `
    <div class="card"><h3>${ICON.terminal} Задание</h3><p>Это «сетевой диагностический» инструмент: сервер подставляет ваш ввод в команду <code>ping -c1 [адрес]</code>. Введите обычный адрес, а затем попробуйте «вырваться» из команды через <code>;</code> и дописать свою. Безопасный симулятор — ничего реально не выполняется.</p></div>
    <div class="lab">
      <div class="field"><label>Адрес для проверки</label><input type="text" id="cmdin" class="inp" value="8.8.8.8"></div>
      <div class="chipset"><button class="chip" id="cmdhint">подставить: <span class="mono">8.8.8.8; cat /flag</span></button></div>
      <div class="row"><button class="btn primary" id="cmdgo">${ICON.arrow} Выполнить ping</button></div>
      <div class="term"><div class="term-head"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="ttl">ping-tool — симулятор</span></div><div class="term-body"><pre class="out" id="cmdout"></pre></div></div>
    </div>
    <div class="defend"><b>Вывод.</b> Символ <code>;</code> (а также <code>|</code>, <code>&amp;&amp;</code>, <code>$()</code>) разделяет команды в shell, и ваша вторая команда выполнилась. Защита — не вызывать оболочку, передавать адрес как отдельный аргумент и проверять его по белому списку.</div>`; },
    wire(){
      $("#cmdhint").onclick = () => { $("#cmdin").value = "8.8.8.8; cat /flag"; };
      $("#cmdgo").onclick = () => {
        const raw = $("#cmdin").value;
        const full = "ping -c1 " + raw;
        const lines = [["c-c","# сервер выполняет: "+esc(full)]];
        const parts = raw.split(/\s*;\s*|\s*&&\s*|\s*\|\s*/).map(s => s.trim()).filter(Boolean);
        const target = parts[0] || "";
        lines.push(["", "PING "+esc(target)+" : 56 data bytes"], ["", "64 bytes from "+esc(target)+": time=11.4 ms"]);
        let injected = false;
        parts.slice(1).forEach(extra => {
          injected = true;
          if (/cat\s+\/?flag/.test(extra)) lines.push(["c-e","$ "+esc(extra)], ["c-s", FLAG("semicolon_runs_a_second_command")]);
          else if (/whoami/.test(extra)) lines.push(["c-e","$ "+esc(extra)], ["c-n","root  ← и это выполнил сервер!"]);
          else lines.push(["c-e","$ "+esc(extra)], ["c-n","(выполнена ваша вторая команда)"]);
        });
        if (injected) lines.push(["c-e","# вы внедрили команду через ';'. в реальной системе так крадут данные."]);
        else lines.push(["c-c","# обычный ping. попробуйте добавить ';' и свою команду"]);
        typeOut($("#cmdout"), lines, 20);
      };
      renderLines($("#cmdout"), [["c-c","# введите адрес и нажмите «Выполнить ping»"]]);
    }}},

{ id:"sniffing", track:"Сети и разведка", title:"Перехват трафика и MITM", sub:"Человек посередине", diff:"med",
  theory:`

  <div class="defend"><b>Защита.</b> Только HTTPS/TLS — тогда перехваченный трафик бесполезен. HSTS не даёт откатиться на HTTP. В недоверенных сетях — VPN. Избегайте открытых Wi-Fi для важных действий.</div>`,
  flag:"https_turns_capture_to_noise",
  lab:{

{ id:"wifi", track:"Сети и разведка", title:"Безопасность Wi-Fi", sub:"Пароли, WPA и чужие сети", diff:"easy",

{ id:"passwords", track:"Атаки и вредоносное ПО", title:"Стойкость паролей и 2FA", sub:"Длина важнее сложности", diff:"easy",
  theory:`

    <p>Проверьте ниже, как длина меняет оценку (это грубая учебная оценка, не точная).</p></div>`,
  lab:{
    render(){ return `
    <div class="lab">
      <div class="field"><label>Пароль</label><input type="text" id="pwx" class="inp" value="qwerty"></div>
      <div class="field"><label>Оценка стойкости</label><div class="meter"><i id="pmeter"></i></div><div class="kv" style="margin-top:8px"><span class="k">уровень</span><span class="v mono" id="plvl"></span><span class="k">совет</span><span class="v" id="ptip"></span></div></div>
    </div>
    <div class="defend"><b>Практика.</b> Разные пароли на каждый сайт, хранить в <b>менеджере паролей</b>, везде где можно включить <b>2FA</b> (второй фактор). Так даже украденный пароль не даёт войти.</div>`; },
    wire(){
      const sets=p=>{let n=0;if(/[a-z]/.test(p))n+=26;if(/[A-Z]/.test(p))n+=26;if(/[0-9]/.test(p))n+=10;if(/[^a-zA-Z0-9]/.test(p))n+=33;return n||1;};
      const COMMON=["qwerty","123456","password","111111","admin","qwerty123"];
      const upd=()=>{const p=$("#pwx").value;const bits=Math.round(p.length*Math.log2(sets(p)));
        let lvl,col,tip,pct;
        if(COMMON.includes(p.toLowerCase())){lvl="в утечках!";col="var(--rose)";tip="этот пароль есть в любом словаре";pct=8;}
        else if(bits<40){lvl="слабый";col="var(--rose)";tip="сделайте длиннее — 12+ символов";pct=Math.min(bits,40)/40*33;}
        else if(bits<70){lvl="средний";col="var(--amber)";tip="добавьте длины, лучше парольная фраза";pct=33+(bits-40)/30*34;}
        else{lvl="стойкий ✓";col="var(--accent)";tip="отлично — и не забудьте 2FA";pct=67+Math.min(bits-70,40)/40*33;}
        const m=$("#pmeter");m.style.width=Math.min(pct,100)+"%";m.style.background=col;
        $("#plvl").textContent=lvl+"  (~"+bits+" бит)";$("#plvl").style.color=col;$("#ptip").textContent=tip;
        if(/✓/.test(lvl)&&!revealed){revealed=true;const w=el("div","term");w.style.marginTop="14px";w.innerHTML='<div class="term-head"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="ttl">strength — ok</span></div><div class="term-body"><pre class="out" id="pwflag"></pre></div>';$("#ptip").closest(".lab").appendChild(w);typeOut($("#pwflag"),[["c-s","стойкий пароль! флаг:"],["c-s","flag -> "+FLAG("length_beats_complexity")]],16);}
      };
      let revealed=false;
      $("#pwx").addEventListener("input",upd);upd();
    }},
  flag:"length_beats_complexity" },

{ id:"malware", track:"Атаки и вредоносное ПО", title:"Вредоносное ПО: типы", sub:"Вирусы, трояны, шифровальщики", diff:"easy",
  theory:`

Q("hmac","Криптография","HMAC и целостность","Подпись сообщения на общем ключе","med",
  card(ICON.key,"Проверка «это точно от тебя и не изменено»","<p>Обычный хеш подтверждает, что данные не изменились случайно. Но злоумышленник, меняя данные, пересчитает и хеш. <b>HMAC</b> решает это: хеш берётся с секретным ключом, который знают только стороны. Подделать HMAC, не зная ключа, нельзя.</p><p>HMAC даёт <b>целостность + аутентичность</b>: сообщение не изменено и пришло от того, кто знает ключ. Используется в API, токенах (JWT с HS256), вебхуках.</p>")

  [["Что добавляет HMAC по сравнению с обычным хешем?",["Скорость","Секретный ключ: подделать подпись без ключа нельзя","Цвет","Сжатие"],1,"Секретный ключ делает подпись недоступной для подделки."],

Q("dh","Криптография","Обмен ключами Диффи-Хеллмана","Договориться о секрете по открытому каналу","hard",

Q("randomness","Криптография","Случайность и CSPRNG","Почему слабый random ломает всё","med",

Q("steganography","Криптография","Стеганография","Спрятать сам факт сообщения","easy",
  card(ICON.eye,"Прятать, а не шифровать","<p>Шифрование скрывает <b>содержание</b>, а стеганография скрывает сам <b>факт</b> передачи: данные прячут внутри картинки, аудио или текста так, что внешне ничего необычного. Например, меняют младшие биты пикселей — на глаз не видно.</p><p>В CTF и в расследованиях часто ищут скрытые данные в файлах. Стеганография не заменяет шифрование — их комбинируют: сначала шифруют, потом прячут.</p>")

Q("sop-cors","Веб-уязвимости (OWASP)","Same-Origin Policy и CORS","Почему сайты изолированы","med",
  card(ICON.globe,"Границы между сайтами","<p><b>Same-Origin Policy</b> — базовое правило браузера: скрипт с одного сайта не может читать данные другого сайта. Иначе вкладка с вредным сайтом читала бы вашу почту в соседней вкладке.</p><p><b>CORS</b> — контролируемое исключение: сервер специальными заголовками разрешает определённым сайтам обращаться к своему API. Ошибка в настройке CORS (например <code>Access-Control-Allow-Origin: *</code> вместе с куками) открывает данные чужим сайтам.</p>")
  + Dc("Настраивайте CORS по белому списку доменов, не используйте <code>*</code> для приватных API с куками и всегда проверяйте заголовок Origin на сервере."),

/* ===== in-browser code runner (user writes JS, we run it sandboxed in a Worker with a timeout) ===== */
function runCode(code, fnName, tests, cb){
  const workerSrc = `self.onmessage=function(e){
    var d=e.data, fn, results=[];
    try{ fn=new Function(d.code+"\\n;return typeof "+d.fn+"==='function'?"+d.fn+":undefined;")(); }
    catch(ex){ self.postMessage({error:"Ошибка в коде: "+ex.message}); return; }
    if(typeof fn!=="function"){ self.postMessage({error:"Функция "+d.fn+"(...) не объявлена"}); return; }
    for(var i=0;i<d.tests.length;i++){
      var t=d.tests[i], got, ok=false;
      try{ got=fn.apply(null,t.in); ok=JSON.stringify(got)===JSON.stringify(t.out); }
      catch(ex){ got="⚠ "+ex.message; }
      results.push({"in":t.in,out:t.out,got:got,ok:ok});
    }
    self.postMessage({results:results});
  };`;
  let url;
  try {
    url = URL.createObjectURL(new Blob([workerSrc], {type:"application/javascript"}));
    const w = new Worker(url); let done = false;
    const fin = data => { if (done) return; done = true; clearTimeout(timer); try{w.terminate();}catch(e){} try{URL.revokeObjectURL(url);}catch(e){} cb(data); };
    const timer = setTimeout(() => fin({error:"Превышено время выполнения (2с). Возможно, бесконечный цикл."}), 2000);
    w.onmessage = ev => fin(ev.data);
    w.onerror = ev => fin({error:"Ошибка выполнения: " + (ev.message || "неизвестно")});
    w.postMessage({code, fn:fnName, tests});
  } catch(e){
    try {
      const fn = new Function(code + "\n;return typeof " + fnName + "==='function'?" + fnName + ":undefined;")();
      if (typeof fn !== "function"){ cb({error:"Функция " + fnName + "(...) не объявлена"}); return; }
      cb({ results: tests.map(t => { let got, ok=false; try { got = fn.apply(null, t.in); ok = JSON.stringify(got)===JSON.stringify(t.out); } catch(ex){ got = "⚠ " + ex.message; } return {in:t.in, out:t.out, got, ok}; }) });
    } catch(ex){ cb({error:"Ошибка: " + ex.message}); }
  }
}
function makeCodeLab(spec){
  return {
    render(){ return (
      card(ICON.code, "Задание", "<p>" + spec.task + "</p>")
      + '<div class="lab">'
      +   '<div class="field"><label>Ваш код на JavaScript</label><textarea class="editor" id="editor" spellcheck="false">' + esc(spec.starter) + '</textarea></div>'
      +   '<div class="row"><button class="btn primary" id="runBtn">' + ICON.arrow + ' Запустить тесты</button><button class="btn ghost" id="resetCode">Сбросить код</button></div>'
      +   '<div class="field"><label>Результаты тестов</label><div class="tests" id="tests"><div class="hint">Напишите код и нажмите «Запустить тесты».</div></div></div>'
      + '</div>'
      + '<div class="defend"><b>Зачем это в безопасности.</b> ' + spec.why + '</div>'
    ); },
    wire(){
      const ed = $("#editor");
      $("#resetCode").onclick = () => { ed.value = spec.starter; };
      ed.addEventListener("keydown", e => { if (e.key === "Tab"){ e.preventDefault(); const s = ed.selectionStart; ed.setRangeText("  ", s, ed.selectionEnd, "end"); } });
      $("#runBtn").onclick = () => {
        $("#tests").innerHTML = '<div class="hint">Выполняется…</div>';
        runCode(ed.value, spec.fn, spec.tests, data => {
          if (data.error){ $("#tests").innerHTML = '<div class="tcase fail"><span class="st">✕</span><span class="d c-e">' + esc(data.error) + '</span></div>'; return; }
          const passed = data.results.filter(r => r.ok).length, total = data.results.length;
          const rows = data.results.map(r => {
            const call = spec.fn + "(" + r.in.map(x => JSON.stringify(x)).join(", ") + ")";
            return '<div class="tcase ' + (r.ok ? "pass" : "fail") + '"><span class="st">' + (r.ok ? ICON.check : "✕") + '</span><span class="d">' + esc(call) + " → <b>" + esc(JSON.stringify(r.got)) + "</b>" + (r.ok ? "" : ' <span class="exp">ожидалось ' + esc(JSON.stringify(r.out)) + "</span>") + "</span></div>";
          }).join("");
          const head = '<div class="run-sum ' + (passed === total ? "c-s" : "c-e") + '">Пройдено ' + passed + " из " + total + "</div>";
          const tail = passed === total ? '<div class="tcase pass"><span class="st">' + ICON.check + '</span><span class="d c-s">Все тесты пройдены! flag -> ' + FLAG(spec.flag) + "</span></div>" : "";
          $("#tests").innerHTML = head + rows + tail;
        });
      };
    }
  };
}
const CL = (id,track,title,sub,diff,theory,spec) => ({ id, track, title, sub, diff, theory, flag:spec.flag, lab:makeCodeLab(spec) });

/* every lesson has a flag; quiz lessons get an auto-generated one */
const TRACK_ORDER = ["Основы","Практикум: пишем код","Криптография","Веб-уязвимости (OWASP)","Сети и разведка","Атаки и вредоносное ПО","Защита (Blue Team)","Безопасная разработка","Облачная безопасность","Мобильная безопасность","Форензика и реверс","Карьера"];
LESSONS.sort((a,b) => TRACK_ORDER.indexOf(a.track) - TRACK_ORDER.indexOf(b.track));

/* ========================= ENGINE ========================= */
function highlightSQL(q){
  return esc(q).replace(/\b(SELECT|FROM|WHERE|AND|OR)\b/g,'<span class="c-k">$1</span>').replace(/('(?:[^']|'')*')/g,'<span class="c-s">$1</span>');
}
function renderLines(target, lines){
  target.innerHTML = lines.map(([c,t]) => '<span class="ln '+c+'">'+(/<span|&lt;|&amp;/.test(t)?t:esc(t))+'</span>').join("");
}
let typer;
function typeOut(target, lines, speed = 26){
  clearInterval(typer);
  if (reduce){ renderLines(target, lines); return; }
  target.innerHTML = ""; let i = 0;
  typer = setInterval(() => {
    if (i >= lines.length){ clearInterval(typer); return; }
    const [c,t] = lines[i++]; const span = el("span","ln "+c);
    span.innerHTML = /<span|&lt;|&amp;/.test(t)?t:esc(t);
    target.appendChild(span);
    span.animate([{opacity:0,transform:"translateY(3px)"},{opacity:1,transform:"none"}],{duration:170,fill:"forwards"});
  }, speed);
}
let tt; function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("on"); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove("on"),2200); }
function confetti(){
  if (reduce) return;
  const cols=["#6ee7a0","#58c7e0","#f2c14e","#b495f5","#ff6b7a"];
  for(let i=0;i<70;i++){const s=el("div","spark");s.style.background=cols[i%cols.length];s.style.left=(45+Math.random()*10)+"%";s.style.top="34%";document.body.appendChild(s);
    const ang=Math.random()*Math.PI*2,dist=120+Math.random()*260;
    s.animate([{transform:"translate(0,0) rotate(0)",opacity:1},{transform:"translate("+Math.cos(ang)*dist+"px,"+(Math.sin(ang)*dist+180)+"px) rotate("+Math.random()*720+"deg)",opacity:0}],{duration:900+Math.random()*700,easing:"cubic-bezier(.2,.7,.3,1)",fill:"forwards"}).finished.then(()=>s.remove());}
}

const solved = new Set(store.get("solved", []));
let current = Math.min(store.get("last", 0), LESSONS.length - 1);
const DIFF = { easy:"база", med:"средне", hard:"сложно" };
const DIFFLONG = { easy:"базовый уровень", med:"средний уровень", hard:"продвинуто" };

function updateProgress(){
  const n = solved.size, total = LESSONS.length;
  $("#progTxt").textContent = n + "/" + total;
  $("#barFill").style.width = (n/total*100) + "%";
}
function buildRail(){
  const rail = $("#rail"); rail.innerHTML = "";
  let lastTrack = null;
  LESSONS.forEach((l, i) => {
    if (l.track !== lastTrack){ lastTrack = l.track; rail.appendChild(el("div","trk",esc(l.track))); }
    const b = el("button","lesson"+(solved.has(l.id)?" done":""));
    b.setAttribute("aria-current", i===current);
    b.innerHTML = '<span class="ix">'+(solved.has(l.id)?ICON.check:String(i).padStart(2,"0"))+'</span>'
      + '<span class="tx"><b>'+esc(l.title)+'</b><span>'+esc(l.sub)+'</span></span>'
      + '<span class="kind" title="'+(l.lab?"интерактив":"тест")+'">'+(l.lab?KIND.lab:KIND.quiz)+'</span>';
    b.onclick = () => { current = i; store.set("last", i); openLesson(); };
    rail.appendChild(b);
  });
  rail.appendChild(el("div","railfoot","Всего уроков: "+LESSONS.length+". Прогресс сохраняется в этом браузере."));
}
function markSolved(l){
  if (solved.has(l.id)) return false;
  solved.add(l.id); store.set("solved", [...solved]); confetti(); updateProgress(); buildRail();
  toast(solved.size === LESSONS.length ? "Все "+LESSONS.length+" уроков пройдены! 🏆" : "Урок пройден 🎉");
  return true;
}
function solvedBanner(l){
  const next = current < LESSONS.length - 1;
  return '<div class="solved-banner">'+(solved.size===LESSONS.length?ICON.trophy:ICON.check)
    + '<div><b>Урок пройден.</b> <span class="fl">'+FLAG(l.flag)+'</span></div>'
    + (next?'<button class="btn primary next" id="nextBtn">Дальше '+ICON.arrow+'</button>':'') + '</div>';
}
function navLine(){
  const prev = current>0, next = current<LESSONS.length-1;
  return '<div class="navline">'
    + (prev?'<button class="btn ghost" id="prevBtn">← '+esc(LESSONS[current-1].title)+'</button>':'<span></span>')
    + (next?'<button class="btn ghost" id="nextBtn2">'+esc(LESSONS[current+1].title)+' →</button>':'<span></span>')
    + '</div>';
}

function openLesson(){
  const l = LESSONS[current];
  buildRail();
  const m = $("#main");
  const done = solved.has(l.id);
  m.innerHTML =
    '<div class="crumbs"><span class="tag mono">'+String(current).padStart(2,"0")+'</span><span>'+esc(l.track)+'</span>'
      + '<span class="diffpill d-'+(l.diff==="med"?"med":l.diff==="hard"?"hard":"easy")+'">'+DIFF[l.diff]+'</span>'
      + '<span style="color:var(--muted)">'+DIFFLONG[l.diff]+'</span></div>'
    + '<h1 class="h1">'+esc(l.title)+'</h1><p class="lede">'+esc(l.sub)+'.</p>'
    + (done?solvedBanner(l):'')
    + l.theory
    + '<div id="interactive"></div>'
    + navLine();

  const slot = $("#interactive");
  if (l.lab){ renderLab(l, slot, done); }
  else { renderQuiz(l, slot, done); }

  // nav buttons
  const goPrev = () => { current=Math.max(0,current-1); store.set("last",current); openLesson(); window.scrollTo({top:0,behavior:reduce?"auto":"smooth"}); };
  const goNext = () => { current=Math.min(LESSONS.length-1,current+1); store.set("last",current); openLesson(); window.scrollTo({top:0,behavior:reduce?"auto":"smooth"}); };
  const pb=$("#prevBtn"); if(pb) pb.onclick=goPrev;
  const nb=$("#nextBtn2"); if(nb) nb.onclick=goNext;
  const nbTop=$("#nextBtn"); if(nbTop) nbTop.onclick=goNext;
}

function renderLab(l, slot, done){
  slot.innerHTML = '<div class="card"><h3>'+ICON.terminal+' Лаборатория</h3><p>Выполните задание — в выводе появится строка '
    + '<code>FLAG{…}</code>. Вставьте её в поле ниже.</p></div>'
    + l.lab.render()
    + '<div class="flagbox"><div class="fh">'+ICON.flag+' Отправить флаг</div>'
    + '<div class="flag-in"><input type="text" id="flagInput" class="mono" placeholder="FLAG{...}" value="'+(done?FLAG(l.flag):"")+'" '+(done?"disabled":"")+' autocomplete="off" spellcheck="false"><button class="btn primary" id="flagSubmit">Проверить</button></div>'
    + '<div class="verdict '+(done?"ok":"")+'" id="verdict">'+(done?"Принято ✓":"")+'</div>'
    + '<div class="hint"><button id="hintBtn">Показать подсказку</button><div class="hint-text hide" id="hintText"></div></div></div>';
  try { l.lab.wire(); } catch(e){ /* keep page alive */ }
  $("#hintBtn").onclick = () => { const h=$("#hintText"); h.classList.toggle("hide"); h.textContent = HINTS[l.id]||"Внимательно читайте вывод в терминале — флаг идёт после строки flag ->."; $("#hintBtn").textContent = h.classList.contains("hide")?"Показать подсказку":"Скрыть подсказку"; };
  const submit = () => {
    const v=$("#verdict"), val=$("#flagInput").value.trim();
    if (val.replace(/\s+/g,"") === FLAG(l.flag).replace(/\s+/g,"")){
      v.className="verdict ok"; v.textContent="Верно! Флаг принят ✓"; $("#flagInput").disabled=true;
      markSolved(l); openLesson(); $("#main").scrollIntoView({block:"start",behavior:reduce?"auto":"smooth"});
    } else { v.className="verdict no"; v.textContent="Пока не то. Проверьте формат FLAG{...}";
      const inp=$("#flagInput"); inp.classList.remove("shake"); void inp.offsetWidth; inp.classList.add("shake"); }
  };
  $("#flagSubmit").onclick = submit;
  $("#flagInput").addEventListener("keydown", e => { if(e.key==="Enter") submit(); });
}

function renderQuiz(l, slot, done){
  const picks = {};
  slot.innerHTML = '<div class="card"><h3>'+ICON.book+' Проверка знаний</h3><p>Ответьте на вопросы, чтобы закрыть урок. Можно пробовать, пока не выйдет.</p></div>'
    + '<div class="quiz" id="quiz">'
    + l.quiz.map((q,qi) =>
        '<div class="q" data-qi="'+qi+'"><div class="qt"><span class="n">'+(qi+1)+'</span>'+esc(q.q)+'</div>'
        + '<div class="opts">'
        + q.a.map((opt,oi)=>'<button class="opt'+(done&&oi===q.c?" correct":"")+'" data-oi="'+oi+'" aria-pressed="'+(done&&oi===q.c?"true":"false")+'"><span class="mk">'+(done&&oi===q.c?ICON.check:"")+'</span><span>'+esc(opt)+'</span></button>').join("")
        + '</div>'+(done?'<div class="why"><b>Почему:</b> '+esc(q.why)+'</div>':'')+'</div>'
      ).join("")
    + '</div>'
    + '<div class="flagbox" style="margin-top:16px"><div class="row"><button class="btn primary" id="checkQuiz" '+(done?"disabled":"")+'>'+ICON.check+' Проверить ответы</button><span class="verdict '+(done?"ok":"")+'" id="qverdict">'+(done?"Урок пройден ✓ · "+FLAG(l.flag):"")+'</span></div></div>';

  if (done) return;
  slot.querySelectorAll(".q").forEach(qEl => {
    const qi = +qEl.dataset.qi;
    qEl.querySelectorAll(".opt").forEach(opt => opt.onclick = () => {
      picks[qi] = +opt.dataset.oi;
      qEl.querySelectorAll(".opt").forEach(o => { o.setAttribute("aria-pressed", o===opt); o.querySelector(".mk").innerHTML = ""; });
    });
  });
  $("#checkQuiz").onclick = () => {
    const v = $("#qverdict");
    if (Object.keys(picks).length < l.quiz.length){ v.className="verdict no"; v.textContent="Ответьте на все вопросы"; return; }
    let allRight = true;
    slot.querySelectorAll(".q").forEach(qEl => {
      const qi=+qEl.dataset.qi, correct=l.quiz[qi].c, chosen=picks[qi];
      qEl.querySelectorAll(".opt").forEach(o => {
        const oi=+o.dataset.oi; o.classList.remove("correct","wrong");
        if (oi===correct){ o.classList.add("correct"); o.querySelector(".mk").innerHTML=ICON.check; }
        else if (oi===chosen){ o.classList.add("wrong"); }
      });
      if (chosen!==correct) allRight=false;
      if (!qEl.querySelector(".why")){ const w=el("div","why","<b>Почему:</b> "+esc(l.quiz[qi].why)); qEl.appendChild(w); }
    });
    if (allRight){ v.className="verdict ok"; v.textContent="Всё верно! Урок пройден ✓"; markSolved(l); openLesson(); $("#main").scrollIntoView({block:"start",behavior:reduce?"auto":"smooth"}); }
    else { v.className="verdict no"; v.textContent="Есть ошибки — исправьте выделенные и проверьте снова"; }
  };
}

  idor:"Кнопкой +1 смените user_id на чужой (не 1001) и отправьте.",
  headers:"Включите все четыре заголовка — оценка дойдёт до 100%.",
  jwt:"Нажмите «Декодировать» — payload JWT читается без ключа, флаг прямо в нём.",
  portscan:"Запустите скан — флаг появится в конце вывода.",
  passwords:"Введите длинную парольную фразу (12+ символов), пока уровень не станет «стойкий».",
  phishing:"Отметьте все три письма (где фишинг, где нет) — разбор откроет флаг.",
};

/* ===== boot ===== */
$("#themeBtn").onclick = () => {
  const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: light)").matches?"light":"dark");
  const next = cur==="dark"?"light":"dark"; document.documentElement.dataset.theme=next; store.set("theme",next);
};
$("#resetBtn").onclick = () => { if(solved.size===0){toast("Прогресс уже пуст");return;} solved.clear(); store.set("solved",[]); updateProgress(); openLesson(); toast("Прогресс сброшен"); };

const savedTheme = store.get("theme", null); if (savedTheme) document.documentElement.dataset.theme = savedTheme;
updateProgress(); openLesson();
})();
</script>
