<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f2f3f1" />
<title>Меню</title>
<link rel="stylesheet" href="/css/menu.css" />
<script>
  // Тему выставляем до отрисовки, чтобы страница не «мигала»
  try {
    const t = localStorage.getItem('guestmenu_theme');
    if (t) document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#top" id="brand"></a>
    <button class="icon-btn" id="themeToggle" aria-label="Сменить тему">
      <svg class="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>

  <main id="top">
    <section class="hero" id="hero"></section>
    <nav class="cat-nav" id="catNav" aria-label="Категории"></nav>
    <div id="menu"></div>
    <div class="loading" id="loading">Загружаем меню…</div>
  </main>

  <footer class="footer" id="footer"></footer>

  <div class="sheet-backdrop" id="sheet" hidden>
    <div class="sheet" role="dialog" aria-modal="true">
      <button class="icon-btn sheet-close" id="sheetClose" aria-label="Закрыть">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <div id="sheetBody"></div>
    </div>
  </div>

  <script src="/js/menu.js"></script>
</body>
</html>
