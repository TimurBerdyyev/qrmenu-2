<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Cafe POS</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="center-screen">
    <div class="role-card">
      <h1>☕ Cafe POS</h1>
      <p class="sub">Выберите, за каким устройством вы работаете</p>
      <div class="role-buttons">
        <button class="role-btn" data-href="/waiter.html">
          <span class="emoji">🧑‍🍳</span>
          <span>
            Официант
            <span class="desc">Приём заказов, столы, чек</span>
          </span>
        </button>
        <button class="role-btn" data-href="/kitchen.html">
          <span class="emoji">🍳</span>
          <span>
            Кухня
            <span class="desc">Экран заказов для поваров</span>
          </span>
        </button>
        <button class="role-btn" data-href="/admin.html">
          <span class="emoji">📊</span>
          <span>
            Администратор
            <span class="desc">Меню, выручка, отчёты</span>
          </span>
        </button>
      </div>
    </div>
  </div>
  <script src="/js/index.js"></script>
</body>
</html>
